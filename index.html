<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>Bankwacht</title>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#FFFFFF; --fill:#EFEFF4;
  --sep:rgba(60,60,67,.20);
  --text:#0A0A0A; --text2:rgba(60,60,67,.62); --text3:rgba(60,60,67,.38);
  --tint:#0B69C7; --tint-soft:rgba(11,105,199,.12);
  --bench:#B25E00; --bench-soft:rgba(178,94,0,.12);
  --danger:#C8102E; --danger-soft:rgba(200,16,46,.12);
  --ok:#1E7B34;
  --cg:#1E9E4A; --cy:#E0A800; --cr:#C8102E;
  --r:14px; --r-lg:18px;
  --nav-h:calc(52px + env(safe-area-inset-top,0px));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:#2C2C2E;
    --sep:rgba(84,84,88,.65);
    --text:#FFFFFF; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.32);
    --tint:#4DA6FF; --tint-soft:rgba(77,166,255,.18);
    --bench:#FFA53D; --bench-soft:rgba(255,165,61,.18);
    --danger:#FF5A5F; --danger-soft:rgba(255,90,95,.18);
    --ok:#3ED16A;
    --cg:#3ED16A; --cy:#FFD60A; --cr:#FF5A5F;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:#2C2C2E;
  --sep:rgba(84,84,88,.65);
  --text:#FFFFFF; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.32);
  --tint:#4DA6FF; --tint-soft:rgba(77,166,255,.18);
  --bench:#FFA53D; --bench-soft:rgba(255,165,61,.18);
  --danger:#FF5A5F; --danger-soft:rgba(255,90,95,.18);
  --ok:#3ED16A; --cg:#3ED16A; --cy:#FFD60A; --cr:#FF5A5F;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.35; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;position:relative}

/* ---------- navigatiebalk ---------- */
.nav{
  flex:0 0 auto; position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  padding-top:env(safe-area-inset-top,0px);
}
.nav-row{display:flex;align-items:center;gap:6px;height:52px;padding:0 6px}
.nav-btn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:10px}
.nav-btn:active{background:var(--fill)}
.nav-btn.txt{padding:0 10px;font-size:17px}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sub{display:block;font-size:12px;font-weight:400;color:var(--text2);letter-spacing:0}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
main.no-scroll{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}

/* ---------- algemene bouwstenen ---------- */
.wrap{padding:0 16px}
h1.large{font-size:32px;font-weight:700;letter-spacing:-.024em;margin:8px 16px 14px}
.sec{margin:22px 0 7px;padding:0 16px;font-size:13px;color:var(--text2)}
.card{background:var(--surface);border-radius:var(--r);margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--text2);margin-top:2px}
.row .v{color:var(--text2);font-size:15px}
.chev{color:var(--text3);flex:0 0 auto}
button.row:active{background:var(--fill)}
.row input[type=text],.row input[type=date],.row input[type=number]{
  flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;font-size:17px
}
.row label.lbl{flex:0 0 auto;font-size:17px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:var(--r);
  background:var(--tint);color:#fff;font-size:17px;font-weight:600;width:100%}
.btn:active{opacity:.82}
.btn[disabled]{opacity:.38}
.btn.sec{background:var(--surface);color:var(--tint)}
.btn.dngr{background:var(--danger)}
.btn.ghost{background:var(--fill);color:var(--text)}
.pad{padding:16px}
.muted{color:var(--text2);font-size:14px;padding:0 16px;margin:8px 0}
.empty{text-align:center;color:var(--text2);padding:56px 28px;font-size:15px}

.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.stepper{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:9px;padding:2px}
.stepper button{width:40px;height:32px;border-radius:7px;font-size:19px;font-weight:500;color:var(--tint)}
.stepper button:active{background:var(--surface)}
.stepper span{min-width:44px;text-align:center;font-size:16px}

/* ---------- wedstrijdscherm ---------- */
.score{
  flex:0 0 auto;background:var(--surface);border-bottom:.5px solid var(--sep);
  padding:10px 12px 12px;
}
.score-top{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%}
.score-side{flex:1 1 0;min-width:0;text-align:center}
.score-side .nm{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-side .pt{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.score-mid{flex:0 0 auto;text-align:center;padding:0 2px}
.clock{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1}
.clock.over{color:var(--danger)}
.clock.idle{color:var(--text3)}
.clock-sub{font-size:11.5px;color:var(--text2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--text2);margin-top:6px}
.pill.live{background:var(--tint-soft);color:var(--tint)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tint)}
.pill.paused{background:var(--bench-soft);color:var(--bench)}

/* wedstrijdblad */
.sheet-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pl{background:var(--surface);border-radius:12px;padding:8px 9px;display:flex;gap:8px;align-items:center;
  text-align:left;width:100%;border:1.5px solid transparent;min-height:56px}
.pl:active{transform:scale(.985)}
.pl .n{flex:0 0 32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;background:var(--fill);color:var(--text)}
.pl.field{border-color:var(--tint-soft)}
.pl.field .n{background:var(--tint);color:#fff}
.pl.bench{opacity:.92}
.pl.bench .n{background:var(--bench-soft);color:var(--bench)}
.pl.susp{border-color:var(--danger-soft)}
.pl.susp .n{background:var(--danger);color:#fff}
.pl.out{opacity:.45}
.pl .info{min-width:0;flex:1}
.pl .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tm{font-size:11.5px;color:var(--text2);margin-top:1px;display:flex;gap:7px}
.pl .tm b{font-weight:600;color:var(--text)}
.pl .tm .bb{color:var(--bench)}

/* strafbank + bank */
.strip{flex:0 0 auto;padding:6px 10px;border-top:.5px solid var(--sep);background:var(--bg)}
.strip h6{margin:0 0 5px 2px;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.01em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);
  border-radius:11px;padding:6px 10px;min-height:40px}
.chip b{font-size:15px;font-weight:700}
.chip .tt{font-size:12px;color:var(--text2)}
.chip.bench b{color:var(--bench)}
.chip.sus{background:var(--danger-soft)}
.chip.sus b{color:var(--danger)}
.chip.sus .tt{color:var(--danger);font-weight:600}
.chip.ready{background:var(--tint-soft)}
.chip-empty{font-size:12.5px;color:var(--text3);padding:10px 2px}

/* actiebalk */
.dock{flex:0 0 auto;background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px}
.act{flex:1;height:52px;border-radius:13px;background:var(--fill);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600}
.act svg{width:20px;height:20px}
.act:active{opacity:.7}
.act.primary{background:var(--tint);color:#fff;flex:1.25}
.act.stop{background:var(--bench);color:#fff}
.act[disabled]{opacity:.4}

/* ---------- modale sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);
  border-radius:16px 16px 0 0;max-height:88%;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.modal.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.modal,.scrim{transition:none}}
.modal .hdl{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 2px;flex:0 0 auto}
.modal .mh{display:flex;align-items:center;padding:8px 8px 6px;flex:0 0 auto}
.modal .mh .ttl{flex:1;text-align:center;font-size:17px;font-weight:600}
.modal .mb{overflow-y:auto;padding-bottom:16px}
.menu-list{list-style:none;margin:0;padding:0}

.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;background:var(--surface)}
.opt + .opt{border-top:.5px solid var(--sep)}
.opt:active{background:var(--fill)}
.opt .badge{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;background:var(--fill)}
.opt .badge.f{background:var(--tint);color:#fff}
.opt .badge.b{background:var(--bench-soft);color:var(--bench)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.dot.g{background:var(--cg)} .dot.y{background:var(--cy)} .dot.r{background:var(--cr)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);
  background:rgba(28,28,30,.96);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;
  opacity:0;transition:.2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* stats & log */
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11.5px;color:var(--text2);font-weight:500;text-align:right;padding:8px 8px;border-bottom:.5px solid var(--sep)}
table.st th:first-child,table.st td:first-child{text-align:left;padding-left:14px}
table.st td{padding:9px 8px;text-align:right;border-bottom:.5px solid var(--sep)}
table.st tr:last-child td{border-bottom:0}
.logline{display:flex;gap:10px;padding:9px 16px;font-size:14px;align-items:baseline}
.logline + .logline{border-top:.5px solid var(--sep)}
.logline .lt{flex:0 0 58px;color:var(--text2);font-size:12.5px}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <header class="nav"><div class="nav-row" id="nav"></div></header>
  <main id="view"></main>
  <footer id="dock" hidden></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Bankwacht — speeltijd en banktijd bijhouden tijdens hockey
   ============================================================ */

/* ---------- opslag ---------- */
const KEY = "bankwacht.v1";
let S = { seasons: [], activeSeason: null, openMatch: null };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.seasons)) S = Object.assign(S, p); }
  }catch(e){ console.warn("laden mislukt", e); }
}
let saveT = null;
function save(now){
  const go = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ console.warn("bewaren mislukt", e);} };
  if(now){ clearTimeout(saveT); go(); return; }
  clearTimeout(saveT); saveT = setTimeout(go, 400);
}
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- helpers ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mmss(ms){
  ms = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(ms/60), s = ms%60;
  return m + ":" + String(s).padStart(2,"0");
}
function hmm(ms){
  const t = Math.max(0, Math.round(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60);
  return h > 0 ? h + "u" + String(m).padStart(2,"0") : m + " min";
}
function dateNL(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("nl-BE",{day:"numeric",month:"short",year:"numeric"});
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1900);
}
function ordinalPart(i, total){
  if(total === 2) return (i===0?"1e":"2e") + " helft";
  if(total === 4) return "Q" + (i+1);
  return "Deel " + (i+1);
}
const svg = {
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="23" height="23"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 5l7 7-7 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.2-3.2M20 16H7l3.2 3.2"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2.2"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="21" height="21"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- model ---------- */
const CARD_DEF = { groen:{label:"Groene kaart", ms:120000, cls:"g"}, geel:{label:"Gele kaart", ms:300000, cls:"y"}, rood:{label:"Rode kaart", ms:null, cls:"r"} };

function season(){ return S.seasons.find(s=>s.id===S.activeSeason) || null; }
function match(){ const se = season(); if(!se) return null; return se.matches.find(m=>m.id===S.openMatch) || null; }

function newSeason(name, team){
  const s = { id:uid(), name, team, created:Date.now(), roster:{}, matches:[] };
  S.seasons.unshift(s); S.activeSeason = s.id; save(true); return s;
}
function newMatch(se, data){
  const m = {
    id:uid(), date:data.date, opponent:data.opponent, venue:data.venue,
    cfg:{ sport:data.sport, parts:data.parts, partMin:data.partMin, onField:data.onField },
    status:"live", created:Date.now(),
    clock:{ part:0, parts:new Array(data.parts).fill(0), running:false, since:null },
    score:{ us:0, them:0 },
    players:{}, log:[]
  };
  data.squad.forEach(p=>{
    m.players[p.n] = { n:p.n, name:p.name||"", status:p.start?"field":"bench",
      fieldMs:0, benchMs:0, suspMs:0, subs:0, since:0, longestBench:0,
      cards:[], susp:null, ready:false };
  });
  se.matches.unshift(m); return m;
}

/* klok: alle spelertijden lopen op de wedstrijdklok, dus stilstand telt niet mee */
function elapsedPart(m, i){
  const c = m.clock, base = c.parts[i] || 0;
  if(c.running && c.part === i && c.since) return base + (Date.now() - c.since);
  return base;
}
function elapsedTotal(m){
  let t = 0; for(let i=0;i<m.clock.parts.length;i++) t += elapsedPart(m, i);
  return t;
}
function liveOf(p, T){
  const d = Math.max(0, T - p.since);
  return {
    field: p.fieldMs + (p.status==="field" ? d : 0),
    bench: p.benchMs + (p.status==="bench" ? d : 0),
    susp : p.suspMs  + (p.status==="susp"  ? d : 0),
    spell: d
  };
}
function commit(m, p, T){
  const d = Math.max(0, T - p.since);
  if(p.status==="field") p.fieldMs += d;
  else if(p.status==="bench"){ p.benchMs += d; if(d > p.longestBench) p.longestBench = d; }
  else if(p.status==="susp") p.suspMs += d;
  p.since = T;
}
function logEv(m, text, kind){
  m.log.push({ t: elapsedTotal(m), part: m.clock.part, wall: Date.now(), text, kind: kind||"" });
}
function playersArr(m){ return Object.values(m.players).sort((a,b)=> (+a.n) - (+b.n) || String(a.n).localeCompare(String(b.n))); }
function onFieldNow(m){ return playersArr(m).filter(p=>p.status==="field"); }

/* ---------- acties ---------- */
function toggleClock(){
  const m = match(); if(!m) return;
  const c = m.clock;
  if(c.running){
    c.parts[c.part] = elapsedPart(m, c.part); c.running = false; c.since = null;
    logEv(m, "Klok gepauzeerd");
  }else{
    c.since = Date.now(); c.running = true;
    logEv(m, c.parts[c.part] === 0 ? ordinalPart(c.part, m.cfg.parts) + " gestart" : "Klok hervat");
  }
  save(true); renderMatch();
}
function nudgeClock(deltaMs){
  const m = match(); if(!m) return;
  const c = m.clock;
  c.parts[c.part] = Math.max(0, elapsedPart(m, c.part) + deltaMs);
  if(c.running) c.since = Date.now();
  const T = elapsedTotal(m);
  playersArr(m).forEach(p=>{ if(p.since > T) p.since = T; });
  logEv(m, (deltaMs>0?"+":"−") + Math.abs(Math.round(deltaMs/60000)) + " min op de klok");
  save(true); paint();
}
function endPart(){
  const m = match(); if(!m) return;
  const c = m.clock;
  c.parts[c.part] = elapsedPart(m, c.part); c.running = false; c.since = null;
  logEv(m, "Einde " + ordinalPart(c.part, m.cfg.parts).toLowerCase());
  if(c.part < m.cfg.parts - 1){ c.part++; }
  save(true); closeModal(); renderMatch();
}
function finishMatch(){
  const m = match(); if(!m) return;
  const T = elapsedTotal(m);
  m.clock.parts[m.clock.part] = elapsedPart(m, m.clock.part);
  m.clock.running = false; m.clock.since = null;
  playersArr(m).forEach(p=> commit(m, p, T));
  m.status = "done"; m.totalMs = T;
  logEv(m, "Wedstrijd beëindigd — " + m.score.us + "–" + m.score.them);
  save(true); closeModal(); go("summary");
}
function sub(outN, inN){
  const m = match(); if(!m) return;
  const T = elapsedTotal(m), a = m.players[outN], b = m.players[inN];
  if(!a || !b) return;
  commit(m, a, T); commit(m, b, T);
  a.status = "bench"; b.status = "field"; b.ready = false;
  a.subs++; b.subs++;
  logEv(m, b.n + (b.name?" "+b.name:"") + " in voor " + a.n + (a.name?" "+a.name:""), "sub");
  save(true); renderMatch();
  toast("Gewisseld: " + b.n + " in, " + a.n + " uit");
}
function giveCard(n, type){
  const m = match(); if(!m) return;
  const T = elapsedTotal(m), p = m.players[n], def = CARD_DEF[type];
  commit(m, p, T);
  p.cards.push({ type, at:T });
  if(type === "rood"){ p.status = "out"; p.susp = null; }
  else { p.status = "susp"; p.susp = { type, until: T + def.ms }; }
  p.ready = false;
  logEv(m, def.label + " voor " + p.n + (p.name?" "+p.name:"") + (def.ms?(" — "+(def.ms/60000)+" min"):""), "card");
  save(true); closeModal(); renderMatch();
}
function backFromSusp(n, toField){
  const m = match(); if(!m) return;
  const T = elapsedTotal(m), p = m.players[n];
  commit(m, p, T);
  p.status = toField ? "field" : "bench"; p.susp = null; p.ready = false;
  logEv(m, p.n + (p.name?" "+p.name:"") + " terug " + (toField?"op het veld":"op de bank"));
  save(true); closeModal(); renderMatch();
}
function goal(side, scorerN){
  const m = match(); if(!m) return;
  m.score[side]++;
  const se = season();
  let txt = side==="us" ? "Doelpunt " + (se?se.team:"ons") : "Tegendoelpunt";
  if(scorerN) txt += " — " + scorerN + (m.players[scorerN] && m.players[scorerN].name ? " " + m.players[scorerN].name : "");
  txt += " (" + m.score.us + "–" + m.score.them + ")";
  logEv(m, txt, "goal");
  save(true); closeModal(); renderMatch();
}
function unGoal(side){
  const m = match(); if(!m || m.score[side] <= 0) return;
  m.score[side]--;
  logEv(m, "Doelpunt gecorrigeerd (" + m.score.us + "–" + m.score.them + ")");
  save(true); closeModal(); renderMatch();
}

/* ---------- sheets ---------- */
let modalOpen = false;
function openModal(title, bodyHTML, opts){
  closeModal(true);
  const scrim = document.createElement("div"); scrim.className = "scrim"; scrim.id = "scrim";
  const mo = document.createElement("div"); mo.className = "modal"; mo.id = "modal";
  mo.setAttribute("role","dialog"); mo.setAttribute("aria-modal","true");
  mo.innerHTML = '<div class="hdl"></div>' +
    (title ? '<div class="mh"><div style="width:44px"></div><div class="ttl">'+esc(title)+'</div>'+
             '<button class="nav-btn" data-x>'+svg.close+'</button></div>' : "") +
    '<div class="mb">' + bodyHTML + '</div>';
  document.body.append(scrim, mo);
  requestAnimationFrame(()=>{ scrim.classList.add("on"); mo.classList.add("on"); });
  scrim.onclick = ()=> closeModal();
  const x = mo.querySelector("[data-x]"); if(x) x.onclick = ()=> closeModal();
  modalOpen = true;
  if(opts && opts.onMount) opts.onMount(mo);
}
function closeModal(instant){
  const sc = $("#scrim"), mo = $("#modal");
  modalOpen = false;
  if(!sc && !mo) return;
  if(instant){ sc&&sc.remove(); mo&&mo.remove(); return; }
  sc && sc.classList.remove("on"); mo && mo.classList.remove("on");
  setTimeout(()=>{ sc&&sc.remove(); mo&&mo.remove(); }, 260);
}

/* ---------- scherm: wedstrijd opzetten ---------- */
let setupState = null;
function renderSetup(){
  const se = season(); if(!se) return go("home");

  h += '</div>';

  h += '<div class="sec">Selectie van vandaag</div>';

  h += '<div class="card">';
  if(!st.squad.length){
    h += '<div class="row"><div class="grow"><div class="s">Nog geen spelers. Voeg hieronder rugnummers toe.</div></div></div>';
  }
  st.squad.forEach((p,i)=>{
    h += '<div class="row">'+
      '<button onclick="setupToggle('+i+')" style="flex:0 0 36px;height:36px;border-radius:10px;font-weight:700;font-size:16px;'+
        (p.in?'background:var(--tint);color:#fff':'background:var(--fill);color:var(--text2)')+'">'+esc(p.n)+'</button>'+
      '<input type="text" value="'+esc(p.name)+'" placeholder="naam (optioneel)" style="text-align:left" '+
        'oninput="setupName('+i+',this.value)" autocomplete="off">'+
      (p.in ? '<button onclick="setupStart('+i+')" style="flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 11px;border-radius:9px;'+
        (p.start?'background:var(--tint-soft);color:var(--tint)':'background:var(--fill);color:var(--text2)')+'">'+(p.start?"basis":"bank")+'</button>' : '')+
      '</div>';
  });
  h += '<div class="row"><input type="text" id="newNr" inputmode="numeric" placeholder="rugnummer toevoegen" style="text-align:left" autocomplete="off">'+

  h += '</div>';
  h += '<p class="muted">'+chosen.length+' aanwezig · '+starters.length+' van de '+st.onField+' in de basis</p>';

  h += '<div class="sec">Geavanceerde wedstrijdinstellingen</div><div class="card">';

  }else{

function stepper(key, val, step, min, max){
  return '<div class="stepper"><button onclick="setupStep(\''+key+'\',-'+step+','+min+','+max+')">−</button>'+
         '<span class="num">'+val+'</span>'+
         '<button onclick="setupStep(\''+key+'\','+step+','+min+','+max+')">+</button></div>';
}
function setupStep(k, d, min, max){ setupState[k] = Math.min(max, Math.max(min, setupState[k] + d)); renderSetup(); }
function setupSet(k, v){ setupState[k] = v; renderSetup(); }
function setupToggle(i){ const p = setupState.squad[i]; p.in = !p.in; if(!p.in) p.start = false; renderSetup(); }
function setupStart(i){
  const st = setupState, p = st.squad[i];
  const cnt = st.squad.filter(x=>x.in&&x.start).length;
  if(!p.start && cnt >= st.onField){ toast("Al "+st.onField+" basisspelers gekozen"); return; }
  p.start = !p.start; renderSetup();
}
function setupName(i, v){ setupState.squad[i].name = v; }
function setupAdd(){
  const el = $("#newNr"), n = (el.value||"").trim();
  if(!n) return;
  if(setupState.squad.some(p=>String(p.n)===n)){ toast("Nummer "+n+" staat er al"); el.value=""; return; }
  setupState.squad.push({ n, name:"", in:true, start:false });
  setupState.squad.sort((a,b)=> (+a.n)-(+b.n));
  renderSetup();
  const nn = $("#newNr"); if(nn) nn.focus();
}
function startMatch(){
  const se = season(), st = setupState;
  const squad = st.squad.filter(p=>p.in).map(p=>({ n:p.n, name:(p.name||"").trim(), start:p.start }));
  squad.forEach(p=>{ if(p.name) se.roster[p.n] = p.name; else if(!se.roster[p.n]) se.roster[p.n] = ""; });
  const m = newMatch(se, { date:st.date, opponent:(st.opponent||"").trim(), venue:st.venue,
    sport:st.sport, parts:st.parts, partMin:st.partMin, onField:st.onField, squad });
  logEv(m, "Wedstrijdblad klaar — " + squad.length + " spelers");
  S.openMatch = m.id; setupState = null; save(true); go("match");
}

/* ---------- scherm: wedstrijd ---------- */
function renderMatch(){
  const m = match(), se = season();
  if(!m) return go("season");
  if(m.status !== "live") return go("summary");

  const us = se.team, them = m.opponent || "Tegenstander";
  const left  = m.venue === "home" ? us : them;
  const right = m.venue === "home" ? them : us;
  const lS = m.venue === "home" ? "us" : "them";
  const rS = m.venue === "home" ? "them" : "us";

  nav(menuBtn() + navTitle(us + " – " + them, dateNL(m.date) + " · " + (m.venue==="home"?"thuis":"uit")) +
      '<button class="nav-btn txt" onclick="moreSheet()">Meer</button>');

  let h = '';
  h += '<div class="score">';
  h += '<div class="score-top">';
  h += '<button class="score-side" onclick="goalSheet(\''+lS+'\')"><div class="nm">'+esc(left)+'</div><div class="pt num" data-sc="'+lS+'">'+m.score[lS]+'</div></button>';
  h += '<div class="score-mid"><div class="clock num" id="clk">0:00</div><div class="clock-sub" id="clksub"></div><div id="clkpill"></div></div>';
  h += '<button class="score-side" onclick="goalSheet(\''+rS+'\')"><div class="nm">'+esc(right)+'</div><div class="pt num" data-sc="'+rS+'">'+m.score[rS]+'</div></button>';
  h += '</div></div>';

  h += '<div class="sheet-scroll"><div class="grid" id="grid">';
  playersArr(m).forEach(p=>{
    h += '<button class="pl '+p.status+'" data-p="'+esc(p.n)+'" onclick="playerSheet(\''+esc(p.n)+'\')">'+
      '<span class="n num">'+esc(p.n)+'</span>'+
      '<span class="info"><span class="nm">'+esc(p.name || (p.status==="out"?"uit de wedstrijd":"speler "+p.n))+'</span>'+
      '<span class="tm num"><b data-f="'+esc(p.n)+'">0:00</b><span class="bb" data-b="'+esc(p.n)+'">0:00</span></span></span></button>';
  });
  h += '</div></div>';

  h += '<div class="strip" id="strip"></div>';
  $("#view").innerHTML = h;

  const dock = $("#dock"); dock.hidden = false;
  dock.className = "dock";
  dock.innerHTML =
    '<button class="act '+(m.clock.running?"stop":"primary")+'" onclick="toggleClock()">'+
      (m.clock.running?svg.pause:svg.play)+'<span>'+(m.clock.running?"Pauze":(m.clock.parts[m.clock.part]?"Hervat":"Start"))+'</span></button>'+
    '<button class="act" onclick="subSheet()">'+svg.swap+'<span>Wissel</span></button>'+
    '<button class="act" onclick="cardSheet()">'+svg.card+'<span>Kaart</span></button>'+
    '<button class="act" onclick="moreSheet()">'+svg.more+'<span>Meer</span></button>';
  paint();
}

function paint(){
  const m = match(); if(!m || VIEW !== "match") return;
  const T = elapsedTotal(m), c = m.clock;
  const partMs = elapsedPart(m, c.part), limit = m.cfg.partMin * 60000;

  const clk = $("#clk");
  if(clk){
    clk.textContent = mmss(partMs);
    clk.className = "clock num" + (partMs >= limit ? " over" : (c.running ? "" : " idle"));
    $("#clksub").textContent = ordinalPart(c.part, m.cfg.parts) + " · totaal " + mmss(T);
    const over = partMs >= limit;
    $("#clkpill").innerHTML = c.running
      ? '<span class="pill live">'+(over?"verlenging":"loopt")+'</span>'
      : '<span class="pill '+(partMs?"paused":"")+'">'+(partMs? (over?"tijd om":"stil") :"klaar om te starten")+'</span>';
  }

  // spelers
  let autoDone = false;
  playersArr(m).forEach(p=>{
    if(p.status === "susp" && p.susp && T >= p.susp.until){
      commit(m, p, p.susp.until); p.status = "bench"; p.since = p.susp.until; p.ready = true; p.susp = null;
      logEv(m, p.n + (p.name?" "+p.name:"") + " mag terug");
      autoDone = true;
    }
    const L = liveOf(p, T);
    const f = document.querySelector('[data-f="'+CSS.escape(String(p.n))+'"]');
    const b = document.querySelector('[data-b="'+CSS.escape(String(p.n))+'"]');
    if(f) f.textContent = mmss(L.field);
    if(b) b.textContent = mmss(L.bench);
    const card = document.querySelector('.pl[data-p="'+CSS.escape(String(p.n))+'"]');
    if(card && !card.classList.contains(p.status)){
      card.className = "pl " + p.status;
    }
  });
  if(autoDone){ save(); toast("Straf afgelopen"); }

  // bankbalk + strafbank
  const strip = $("#strip");
  if(strip){
    const bench = playersArr(m).filter(p=>p.status==="bench");
    const susp  = playersArr(m).filter(p=>p.status==="susp");
    let sh = "";
    if(susp.length){
      sh += '<h6>Straftijd</h6><div class="chips">' + susp.map(p=>{
        const rest = Math.max(0, p.susp.until - T);
        return '<button class="chip sus" onclick="playerSheet(\''+esc(p.n)+'\')"><b class="num">'+esc(p.n)+'</b>'+
               '<span class="tt num">'+mmss(rest)+'</span></button>';
      }).join("") + '</div>';
    }
    sh += '<h6>Bank — ' + bench.length + '</h6><div class="chips">';
    if(!bench.length) sh += '<span class="chip-empty">Niemand op de bank.</span>';
    bench.forEach(p=>{
      const L = liveOf(p, T);
      sh += '<button class="chip bench'+(p.ready?" ready":"")+'" onclick="playerSheet(\''+esc(p.n)+'\')">'+
            '<b class="num">'+esc(p.n)+'</b><span class="tt num">'+mmss(L.spell)+'</span></button>';
    });
    sh += '</div>';
    if(strip.dataset.sig !== sh.length + ":" + bench.map(p=>p.n).join() + susp.map(p=>p.n).join()){
      strip.dataset.sig = sh.length + ":" + bench.map(p=>p.n).join() + susp.map(p=>p.n).join();
      strip.innerHTML = sh;
    } else {
      // enkel de tijden verversen
      const chips = strip.querySelectorAll(".chip");
      let i = 0;
      susp.forEach(p=>{ const el = chips[i++]; if(el) el.querySelector(".tt").textContent = mmss(Math.max(0, p.susp.until - T)); });
      bench.forEach(p=>{ const el = chips[i++]; if(el && el.querySelector(".tt")) el.querySelector(".tt").textContent = mmss(liveOf(p,T).spell); });
    }
  }
  document.querySelectorAll("[data-sc]").forEach(el=>{ el.textContent = m.score[el.dataset.sc]; });
}

/* ---------- sheets in de wedstrijd ---------- */
function playerSheet(n){
  const m = match(), p = m.players[n], T = elapsedTotal(m), L = liveOf(p, T);
  const label = p.n + (p.name ? " · " + p.name : "");
  let h = '<div class="card" style="margin-bottom:14px"><div class="row"><div class="grow"><div class="t">Op het veld</div></div><div class="v num" style="color:var(--tint);font-weight:600">'+mmss(L.field)+'</div></div>'+
    '<div class="row"><div class="grow"><div class="t">Op de bank</div></div><div class="v num" style="color:var(--bench);font-weight:600">'+mmss(L.bench)+'</div></div>'+
    '<div class="row"><div class="grow"><div class="t">Keer gewisseld</div></div><div class="v num">'+p.subs+'</div></div>'+
    (p.cards.length?'<div class="row"><div class="grow"><div class="t">Kaarten</div></div><div class="v">'+p.cards.map(c=>CARD_DEF[c.type].label.split(" ")[0]).join(", ")+'</div></div>':'')+
    '</div>';

  if(p.status === "field"){
    const bench = playersArr(m).filter(x=>x.status==="bench");
    h += '<div class="sec">Vervangen door</div><div class="card">';
    if(!bench.length) h += '<div class="row"><div class="s">Niemand beschikbaar op de bank.</div></div>';
    bench.forEach(b=>{
      const BL = liveOf(b, T);
      h += '<button class="opt" onclick="sub(\''+esc(p.n)+'\',\''+esc(b.n)+'\');closeModal()">'+
           '<span class="badge b num">'+esc(b.n)+'</span><span style="flex:1"><span style="display:block">'+esc(b.name||("speler "+b.n))+'</span>'+
           '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(BL.spell)+' op de bank</span></span>'+
           (b.ready?'<span style="font-size:12px;color:var(--tint);font-weight:600">straf uit</span>':'')+'</button>';
    });
    h += '</div>';
  } else if(p.status === "bench"){
    const field = onFieldNow(m);
    h += '<div class="sec">Brengt wie naar de bank?</div><div class="card">';
    field.forEach(f=>{
      const FL = liveOf(f, T);
      h += '<button class="opt" onclick="sub(\''+esc(f.n)+'\',\''+esc(p.n)+'\');closeModal()">'+
           '<span class="badge f num">'+esc(f.n)+'</span><span style="flex:1"><span style="display:block">'+esc(f.name||("speler "+f.n))+'</span>'+
           '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(FL.field)+' gespeeld</span></span></button>';
    });
    h += '</div>';
  } else if(p.status === "susp"){
    const rest = Math.max(0, p.susp.until - T);
    h += '<div class="sec">Straf — nog '+mmss(rest)+'</div><div class="card">'+
      '<button class="opt" onclick="backFromSusp(\''+esc(p.n)+'\',false)"><span style="flex:1">Straf nu beëindigen, naar de bank</span></button>'+
      '<button class="opt" onclick="backFromSusp(\''+esc(p.n)+'\',true)"><span style="flex:1">Straf nu beëindigen, terug het veld in</span></button></div>';
  } else {
    h += '<div class="sec">Rode kaart</div><div class="card"><div class="row"><div class="s">Deze speler doet niet meer mee.</div></div></div>';
  }

  if(p.status !== "out"){
    h += '<div class="sec">Kaart geven</div><div class="card">';
    ["groen","geel","rood"].forEach(t=>{
      const d = CARD_DEF[t];
      h += '<button class="opt" onclick="giveCard(\''+esc(p.n)+'\',\''+t+'\')"><span class="dot '+d.cls+'"></span>'+
           '<span style="flex:1">'+d.label+'</span><span style="color:var(--text2);font-size:14px">'+(d.ms?(d.ms/60000)+" min":"rest van de wedstrijd")+'</span></button>';
    });
    h += '</div>';
  }
  h += '<div style="height:10px"></div>';
  openModal(label, h);
}

function subSheet(){
  const m = match(), T = elapsedTotal(m);
  const field = onFieldNow(m), bench = playersArr(m).filter(p=>p.status==="bench");
  if(!bench.length){ toast("Niemand op de bank"); return; }
  let h = '<p class="muted">Kies eerst wie eruit gaat. Daarna wie erin komt. De sheet blijft open zodat je meerdere wissels na elkaar kan doen.</p>';
  h += '<div class="sec">Van het veld</div><div class="card" id="offList">';
  field.forEach(f=>{
    const L = liveOf(f, T);
    h += '<button class="opt" data-off="'+esc(f.n)+'"><span class="badge f num">'+esc(f.n)+'</span>'+
         '<span style="flex:1"><span style="display:block">'+esc(f.name||("speler "+f.n))+'</span>'+
         '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(L.field)+' gespeeld</span></span></button>';
  });
  h += '</div><div class="sec">Van de bank</div><div class="card" id="onList">';
  bench.forEach(b=>{
    const L = liveOf(b, T);
    h += '<button class="opt" data-on="'+esc(b.n)+'"><span class="badge b num">'+esc(b.n)+'</span>'+
         '<span style="flex:1"><span style="display:block">'+esc(b.name||("speler "+b.n))+'</span>'+
         '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(L.spell)+' op de bank</span></span></button>';
  });
  h += '</div><div class="pad"><button class="btn ghost" onclick="closeModal()">Klaar</button></div>';
  openModal("Wissel", h, { onMount(mo){
    let off = null;
    const mark = ()=> mo.querySelectorAll("[data-off]").forEach(el=>{
      el.style.background = (el.dataset.off === off) ? "var(--tint-soft)" : "";
    });
    mo.querySelectorAll("[data-off]").forEach(el=> el.onclick = ()=>{ off = (off===el.dataset.off?null:el.dataset.off); mark(); });
    mo.querySelectorAll("[data-on]").forEach(el=> el.onclick = ()=>{
      if(!off){ toast("Kies eerst wie van het veld gaat"); return; }
      sub(off, el.dataset.on); off = null; subSheet();
    });
  }});
}

function cardSheet(){
  const m = match(), T = elapsedTotal(m);
  const cands = playersArr(m).filter(p=>p.status==="field" || p.status==="bench");
  let h = '<p class="muted">Kies de speler. Daarna kies je de kaart.</p><div class="card">';
  cands.forEach(p=>{
    h += '<button class="opt" onclick="playerSheet(\''+esc(p.n)+'\')"><span class="badge '+(p.status==="field"?"f":"b")+' num">'+esc(p.n)+'</span>'+
         '<span style="flex:1">'+esc(p.name||("speler "+p.n))+'</span>'+
         '<span style="font-size:13px;color:var(--text2)">'+(p.status==="field"?"veld":"bank")+'</span></button>';
  });
  h += '</div><div style="height:12px"></div>';
  openModal("Kaart geven", h);
}

function goalSheet(side){
  const m = match(), se = season();
  const ours = side === "us";
  let h = "";
  if(ours){
    h += '<div class="sec">Wie scoorde?</div><div class="card">';
    onFieldNow(m).forEach(p=>{
      h += '<button class="opt" onclick="goal(\'us\',\''+esc(p.n)+'\')"><span class="badge f num">'+esc(p.n)+'</span>'+
           '<span style="flex:1">'+esc(p.name||("speler "+p.n))+'</span></button>';
    });
    h += '<button class="opt" onclick="goal(\'us\')"><span class="badge">?</span><span style="flex:1">Zonder speler noteren</span></button></div>';
  }else{
    h += '<div class="pad"><button class="btn" onclick="goal(\'them\')">Tegendoelpunt noteren</button></div>';
  }
  h += '<div class="pad" style="padding-top:4px"><button class="btn ghost" onclick="unGoal(\''+side+'\')">Eén doelpunt terugnemen</button></div>';
  openModal(ours ? "Doelpunt " + se.team : "Doelpunt tegenstander", h);
}

function moreSheet(){
  const m = match();
  const part = ordinalPart(m.clock.part, m.cfg.parts).toLowerCase();
  const last = m.log.slice(-6).reverse();
  let h = '<div class="sec">Klok bijstellen</div><div class="card">';
  h += '<button class="opt" onclick="nudgeClock(60000);closeModal()"><span style="flex:1">Eén minuut bijtellen</span><span style="color:var(--text2)">te laat gestart</span></button>';
  h += '<button class="opt" onclick="nudgeClock(-60000);closeModal()"><span style="flex:1">Eén minuut aftrekken</span><span style="color:var(--text2)">te vroeg gestart</span></button>';
  h += '<button class="opt" onclick="nudgeClock(10000);closeModal()"><span style="flex:1">Tien seconden bijtellen</span></button>';
  h += '<button class="opt" onclick="nudgeClock(-10000);closeModal()"><span style="flex:1">Tien seconden aftrekken</span></button>';
  h += '</div>';
  h += '<div class="sec">Wedstrijd</div><div class="card">';
  if(m.clock.part < m.cfg.parts - 1){
    h += '<button class="opt" onclick="endPart()"><span style="flex:1">Einde '+part+'</span><span style="color:var(--text2);font-size:14px">volgende deel klaarzetten</span></button>';
  }
  h += '<button class="opt" onclick="confirmFinish()"><span style="flex:1;color:var(--danger)">Wedstrijd beëindigen</span></button></div>';
  if(last.length){
    h += '<div class="sec">Laatste gebeurtenissen</div><div class="card">';
    last.forEach(l=> h += '<div class="logline"><span class="lt num">'+mmss(l.t)+'</span><span>'+esc(l.text)+'</span></div>');
    h += '</div>';
  }
  h += '<div style="height:12px"></div>';
  openModal("Meer", h);
}
function confirmFinish(){
  const m = match();
  openModal("Wedstrijd beëindigen",
    '<p class="muted">De klok stopt en alle tijden worden vastgezet. Je kan het overzicht daarna blijven bekijken, maar niet meer verder tellen.</p>'+
    '<div class="pad"><button class="btn dngr" onclick="finishMatch()">Beëindigen op '+m.score.us+'–'+m.score.them+'</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Toch niet</button></div>');
}

/* ---------- scherm: overzicht na de wedstrijd ---------- */
function renderSummary(){
  const m = match(), se = season();
  if(!m) return go("season");
  nav(backBtn("season") + navTitle((se.team) + " – " + (m.opponent||"?"), dateNL(m.date)) + '<div style="width:44px"></div>');
  const T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
  const ps = playersArr(m);
  let h = '<div class="pad" style="text-align:center;padding-bottom:6px">'+
    '<div class="num" style="font-size:44px;font-weight:700;letter-spacing:-.03em">'+m.score.us+'–'+m.score.them+'</div>'+
    '<div style="color:var(--text2);font-size:14px">'+(m.venue==="home"?"thuis":"uit")+' · '+hmm(T)+' effectieve speeltijd</div></div>';

  h += '<div class="sec">Per speler</div><div class="card"><table class="st"><thead><tr>'+
       '<th>Speler</th><th>Veld</th><th>Bank</th><th>Wissels</th></tr></thead><tbody>';
  ps.forEach(p=>{
    const L = liveOf(p, T);
    h += '<tr><td><b class="num">'+esc(p.n)+'</b> '+esc(p.name||"")+'</td>'+
      '<td class="num" style="color:var(--tint);font-weight:600">'+mmss(L.field)+'</td>'+
      '<td class="num" style="color:var(--bench)">'+mmss(L.bench)+'</td>'+
      '<td class="num">'+p.subs+'</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<p class="muted">Langste ononderbroken bankbeurt: '+
       (ps.map(p=>({n:p.n,v:Math.max(p.longestBench, p.status==="bench"?liveOf(p,T).spell:0)}))
          .sort((a,b)=>b.v-a.v).slice(0,1).map(x=> x.v? (x.n+" met "+mmss(x.v)) : "geen").join(""))+'.</p>';

  h += '<div class="sec">Wedstrijdverloop</div><div class="card">';
  if(!m.log.length) h += '<div class="row"><div class="s">Niets gelogd.</div></div>';
  m.log.forEach(l=> h += '<div class="logline"><span class="lt num">'+mmss(l.t)+'</span><span>'+esc(l.text)+'</span></div>');
  h += '</div>';

  if(m.status === "live"){
    h += '<div class="pad"><button class="btn" onclick="go(\'match\')">Terug naar de wedstrijd</button></div>';
  }
  h += '<div class="pad"><button class="btn ghost" onclick="shareMatch()">Overzicht delen</button></div>';
  h += '<div class="pad" style="padding-top:0"><button class="btn sec" style="color:var(--danger)" onclick="delMatch()">Wedstrijd verwijderen</button></div>';
  $("#view").innerHTML = h;
}
function matchText(){
  const m = match(), se = season(), T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
  let t = se.team + " – " + (m.opponent||"?") + "  " + m.score.us + "–" + m.score.them + "\n" + dateNL(m.date) + "\n\n";
  playersArr(m).forEach(p=>{ const L = liveOf(p, T);
    t += p.n + " " + (p.name||"") + " — veld " + mmss(L.field) + ", bank " + mmss(L.bench) + ", " + p.subs + " wissels\n"; });
  return t;
}
async function shareMatch(){
  const txt = matchText();
  try{
    if(navigator.share){ await navigator.share({ title:"Wedstrijdoverzicht", text:txt }); return; }
    await navigator.clipboard.writeText(txt); toast("Gekopieerd");
  }catch(e){
    openModal("Overzicht", '<div class="pad"><textarea readonly style="width:100%;height:260px;font-size:13px;border-radius:12px;border:1px solid var(--sep);background:var(--surface);color:var(--text);padding:12px">'+esc(txt)+'</textarea></div>');
  }
}
function delMatch(){
  openModal("Wedstrijd verwijderen", '<p class="muted">Dit kan niet ongedaan gemaakt worden.</p>'+
    '<div class="pad"><button class="btn dngr" onclick="doDelMatch()">Verwijderen</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Annuleren</button></div>');
}
function doDelMatch(){
  const se = season(); se.matches = se.matches.filter(x=>x.id !== S.openMatch);
  S.openMatch = null; save(true); closeModal(); go("season");
}

/* ---------- scherm: seizoenstotalen ---------- */
function renderSeasonStats(){
  const se = season(); if(!se) return go("home");
  nav(backBtn("season") + navTitle("Seizoenstotalen", se.team) + '<div style="width:44px"></div>');
  const agg = {};
  se.matches.forEach(m=>{
    const T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
    playersArr(m).forEach(p=>{
      const L = liveOf(p, T);
      const a = agg[p.n] || (agg[p.n] = { n:p.n, name:p.name||se.roster[p.n]||"", app:0, field:0, bench:0, subs:0 });
      if(p.name) a.name = p.name;
      a.app++; a.field += L.field; a.bench += L.bench; a.subs += p.subs;
    });
  });
  const rows = Object.values(agg).sort((a,b)=> (+a.n)-(+b.n));
  let h = '<p class="muted">Over '+se.matches.length+' wedstrijd'+(se.matches.length===1?"":"en")+'. Lopende wedstrijden tellen mee met hun stand van nu.</p>';
  if(!rows.length){ h += '<div class="empty">Nog geen gegevens.</div>'; }
  else{
    h += '<div class="card"><table class="st"><thead><tr><th>Speler</th><th>Wedstr.</th><th>Veld</th><th>Bank</th></tr></thead><tbody>';
    rows.forEach(a=>{
      h += '<tr><td><b class="num">'+esc(a.n)+'</b> '+esc(a.name)+'</td><td class="num">'+a.app+'</td>'+
        '<td class="num" style="color:var(--tint);font-weight:600">'+hmm(a.field)+'</td>'+
        '<td class="num" style="color:var(--bench)">'+hmm(a.bench)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  $("#view").innerHTML = h;
}

/* ---------- spelersbestand ---------- */
function editRoster(){
  const se = season();
  const ns = Object.keys(se.roster).sort((a,b)=>a-b);
  let h = '<p class="muted">Deze namen verschijnen automatisch als je een nieuwe wedstrijd aanmaakt.</p><div class="card">';
  if(!ns.length) h += '<div class="row"><div class="s">Nog leeg. Nummers en namen komen hier vanzelf in als je een wedstrijd aanmaakt.</div></div>';
  ns.forEach(n=>{
    h += '<div class="row"><span class="badge num" style="flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--fill);font-weight:700">'+esc(n)+'</span>'+
      '<input type="text" value="'+esc(se.roster[n])+'" placeholder="naam" style="text-align:left" onchange="setRoster(\''+esc(n)+'\',this.value)">'+
      '<button onclick="delRoster(\''+esc(n)+'\')" style="color:var(--danger);font-size:14px;padding:8px">Wis</button></div>';
  });
  h += '</div><div style="height:14px"></div>';
  openModal("Spelersbestand", h);
}
function setRoster(n, v){ const se = season(); se.roster[n] = v.trim(); save(true); }
function delRoster(n){ const se = season(); delete se.roster[n]; save(true); editRoster(); }

/* ---------- back-up ---------- */
async function exportBackup(){
  const data = JSON.stringify(S, null, 1);
  const name = "bankwacht-backup-" + new Date().toISOString().slice(0,10) + ".json";
  try{
    const dl = await claude.use("downloads");
    if(dl){ await dl.save({ filename:name, data }); toast("Back-up opgeslagen"); closeModal(); return; }
  }catch(e){ /* val terug op tekst */ }
  openModal("Back-up", '<p class="muted">Kopieer deze tekst en bewaar ze ergens veilig.</p><div class="pad">'+
    '<textarea readonly style="width:100%;height:240px;font-size:11px;border-radius:12px;border:1px solid var(--sep);background:var(--surface);color:var(--text);padding:10px">'+esc(data)+'</textarea></div>');
}
function importBackup(){
  openModal("Back-up terugzetten",
    '<p class="muted">Plak hier de inhoud van je back-upbestand. Alles wat nu in de app staat wordt vervangen.</p>'+
    '<div class="pad"><input type="file" id="bfile" accept=".json,application/json" style="margin-bottom:12px">'+
    '<textarea id="btext" placeholder="of plak hier" style="width:100%;height:150px;font-size:12px;border-radius:12px;border:1px solid var(--sep);background:var(--surface);color:var(--text);padding:10px"></textarea></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn dngr" id="bgo">Terugzetten</button></div>',
    { onMount(mo){
        mo.querySelector("#bfile").onchange = e=>{
          const f = e.target.files[0]; if(!f) return;
          const r = new FileReader(); r.onload = ()=>{ mo.querySelector("#btext").value = r.result; }; r.readAsText(f);
        };
        mo.querySelector("#bgo").onclick = ()=>{
          try{
            const p = JSON.parse(mo.querySelector("#btext").value);
            if(!p || !Array.isArray(p.seasons)) throw new Error("geen geldige back-up");
            S = p; save(true); closeModal(); go("home"); toast("Back-up teruggezet");
          }catch(err){ toast("Dit bestand kon ik niet lezen"); }
        };
      }});
}

/* ---------- lus ---------- */
function tick(){
  if(VIEW === "match") paint();
  const m = match();
  if(m && m.clock && m.clock.running) save();
}
setInterval(tick, 500);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) paint(); });
window.addEventListener("pageshow", ()=> paint());

/* scherm wakker houden tijdens een lopende wedstrijd, als de browser dat toelaat */
let wakeLock = null;
async function keepAwake(){
  try{
    const m = match();
    if(VIEW === "match" && m && m.clock.running && "wakeLock" in navigator){
      if(!wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    } else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
setInterval(keepAwake, 4000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ wakeLock = null; keepAwake(); } });

/* ---------- start ---------- */
load();
if(S.seasons.length && !S.activeSeason) S.activeSeason = S.seasons[0].id;
const cur = match();
if(cur && cur.status === "live") VIEW = "match";
else if(season()) VIEW = "season";
render();
</script>
