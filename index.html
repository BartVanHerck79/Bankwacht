<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bankwacht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0B69C7">
<title>Bankwacht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B69C7'/%3E%3Cg fill='none' stroke='%23fff' stroke-linecap='round'%3E%3Cpath d='M84.5 18.5 L46.1 58.3' stroke-width='10'/%3E%3Cpath d='M46.1 58.3 A14.5 14.5 0 1 1 24.2 54.4' stroke-width='13'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:#EFEFF4;
  --sep:rgba(60,60,67,.20);
  --text:#0A0A0A; --text2:rgba(60,60,67,.62); --text3:rgba(60,60,67,.38);
  --tint:#0B69C7; --tint-soft:rgba(11,105,199,.12);
  --bench:#B25E00; --bench-soft:rgba(178,94,0,.12);
  --danger:#C8102E; --danger-soft:rgba(200,16,46,.12);
  --cg:#1E9E4A; --cg-soft:rgba(30,158,74,.16);
  --cy:#C79100; --cy-soft:rgba(199,145,0,.18);
  --cr:#C8102E; --cr-soft:rgba(200,16,46,.14);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E;
    --sep:rgba(84,84,88,.65);
    --text:#FFFFFF; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.32);
    --tint:#4DA6FF; --tint-soft:rgba(77,166,255,.18);
    --bench:#FFA53D; --bench-soft:rgba(255,165,61,.18);
    --danger:#FF5A5F; --danger-soft:rgba(255,90,95,.18);
    --cg:#3ED16A; --cg-soft:rgba(62,209,106,.2);
    --cy:#FFD60A; --cy-soft:rgba(255,214,10,.2);
    --cr:#FF5A5F; --cr-soft:rgba(255,90,95,.2);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}

.nav{flex:0 0 auto;position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top,0px)}
.nav-row{display:flex;align-items:center;gap:6px;height:52px;padding:0 6px}
.nav-btn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:10px}
.nav-btn:active{background:var(--fill)}
.nav-btn.txt{padding:0 10px;font-size:17px}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.nav-title{display:block;min-width:0;padding:2px 4px;border-radius:9px}
button.nav-title:active{background:var(--fill)}
.nav-sub{display:block;font-size:12px;font-weight:400;color:var(--text2);letter-spacing:0}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:26px}
main.no-scroll{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}

h1.large{font-size:32px;font-weight:700;letter-spacing:-.024em;margin:8px 16px 14px}
.sec{margin:22px 0 7px;padding:0 16px;font-size:13px;color:var(--text2)}
.card{background:var(--surface);border-radius:var(--r);margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--text2);margin-top:2px}
.row .v{color:var(--text2);font-size:15px}
.chev{color:var(--text3);flex:0 0 auto}
button.row:active{background:var(--fill)}
.row input[type=text],.row input[type=date],.row input[type=tel]{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;font-size:17px}
.row label.lbl{flex:0 0 auto;font-size:17px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:var(--r);
  background:var(--tint);color:#fff;font-size:17px;font-weight:600;width:100%}
.btn:active{opacity:.82}
.btn[disabled]{opacity:.38}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.dngr{background:var(--danger)}
.pad{padding:16px}
.muted{color:var(--text2);font-size:14px;padding:0 16px;margin:8px 0}
.empty{text-align:center;color:var(--text2);padding:52px 28px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.stepper{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:9px;padding:2px}
.stepper button{width:40px;height:32px;border-radius:7px;font-size:19px;color:var(--tint)}
.stepper span{min-width:44px;text-align:center;font-size:16px}

/* wedstrijdscherm */
.score{flex:0 0 auto;background:var(--surface);border-bottom:.5px solid var(--sep);padding:10px 12px 12px}
.score-top{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%}
.score-side{flex:1 1 0;min-width:0;text-align:center}
.score-side .nm{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-side .pt{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.score-mid{flex:0 0 auto;text-align:center}
.clock{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1}
.clock.over{color:var(--danger)}
.clock.idle{color:var(--text3)}
.clock-sub{font-size:11.5px;color:var(--text2);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--text2);margin-top:6px}
.pill.live{background:var(--tint-soft);color:var(--tint)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tint)}
.pill.paused{background:var(--bench-soft);color:var(--bench)}

.sheet-scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pl{position:relative;background:var(--surface);border-radius:12px;padding:8px 26px 8px 9px;display:flex;gap:8px;
  align-items:flex-start;text-align:left;width:100%;border:1.5px solid transparent;min-height:58px}
.pl:active{transform:scale(.985)}
.badge-wrap{position:relative;flex:0 0 32px}
.pl .n{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;background:var(--fill);color:var(--text)}
.goalbub{position:absolute;top:-5px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:var(--cg);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--surface)}
.goalbub[hidden]{display:none}
.subcount{position:absolute;right:6px;bottom:5px;font-size:11px;font-weight:600;color:var(--text3);
  min-width:16px;height:16px;border-radius:99px;background:var(--fill);display:flex;align-items:center;justify-content:center}
.pl.field{border-color:var(--tint-soft)} .pl.field .n{background:var(--tint);color:#fff}
.pl.bench .n{background:var(--bench-soft);color:var(--bench)}
.pl.susp.c-groen{border-color:var(--cg)} .pl.susp.c-groen .n{background:var(--cg);color:#fff}
.pl.susp.c-geel{border-color:var(--cy)}  .pl.susp.c-geel .n{background:var(--cy);color:#000}
.pl.out{opacity:.45} .pl.out .n{background:var(--cr);color:#fff}
.pl .info{min-width:0;flex:1}
.pl .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tm{font-size:11.5px;color:var(--text2);margin-top:2px;display:flex;gap:8px}
.pl .tm b{font-weight:600;color:var(--tint)}
.pl .tm .bb{color:var(--bench);font-weight:600}
.pl .now{font-size:11px;margin-top:2px;color:var(--bench);font-weight:700}
.pl .now.sus{color:var(--danger)}

.strip{flex:0 0 auto;padding:6px 10px;border-top:.5px solid var(--sep);background:var(--bg)}
.strip h6{margin:0 0 5px 2px;font-size:11px;font-weight:600;color:var(--text2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:11px;padding:6px 10px;min-height:40px;border:1.5px solid transparent}
.chip b{font-size:15px;font-weight:700}
.chip .tt{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.chip.bench b{color:var(--bench)}
.chip.sus.c-groen{background:var(--cg-soft);border-color:var(--cg)}
.chip.sus.c-groen b,.chip.sus.c-groen .tt{color:var(--cg);font-weight:700}
.chip.sus.c-geel{background:var(--cy-soft);border-color:var(--cy)}
.chip.sus.c-geel b,.chip.sus.c-geel .tt{color:var(--cy);font-weight:700}
.chip.ready{background:var(--tint-soft);border-color:var(--tint);animation:puls 1.1s ease-in-out infinite}
.pl.field.ready{border-color:var(--tint);animation:puls 1.1s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.chip.ready,.pl.field.ready{animation:none}}
.chip-empty{font-size:12.5px;color:var(--text3);padding:10px 2px}

.dock{flex:0 0 auto;background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.act{flex:1;height:52px;border-radius:13px;background:var(--fill);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600}
.act svg{width:20px;height:20px}
.act:active{opacity:.7}
.act.primary{background:var(--tint);color:#fff;flex:1.25}
.act.stop{background:var(--bench);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:16px 16px 0 0;
  max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.modal.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.modal,.scrim{transition:none}}
.modal .hdl{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 2px;flex:0 0 auto}
.modal .mh{display:flex;align-items:center;padding:8px 8px 6px;flex:0 0 auto}
.modal .mh .ttl{flex:1;text-align:center;font-size:17px;font-weight:600}
.modal .mb{overflow-y:auto;padding-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;background:var(--surface)}
.opt + .opt{border-top:.5px solid var(--sep)}
.opt:active{background:var(--fill)}
.opt .badge{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:var(--fill)}
.opt .badge.f{background:var(--tint);color:#fff}
.opt .badge.b{background:var(--bench-soft);color:var(--bench)}
.dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.dot.groen{background:var(--cg)} .dot.geel{background:var(--cy)} .dot.rood{background:var(--cr)}
.ta{width:100%;height:190px;font-size:12px;border-radius:12px;border:1px solid var(--sep);background:var(--surface);color:var(--text);padding:10px}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);
  background:rgba(28,28,30,.96);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:80;
  opacity:0;transition:.2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11.5px;color:var(--text2);font-weight:500;text-align:right;padding:8px;border-bottom:.5px solid var(--sep)}
table.st th:first-child,table.st td:first-child{text-align:left;padding-left:14px}
table.st td{padding:9px 8px;text-align:right;border-bottom:.5px solid var(--sep)}
table.st tr:last-child td{border-bottom:0}
.logline{display:flex;gap:10px;padding:9px 16px;font-size:14px;align-items:baseline}
.logline + .logline{border-top:.5px solid var(--sep)}
.logline .lt{flex:0 0 58px;color:var(--text2);font-size:12.5px}
.ver{text-align:center;color:var(--text3);font-size:12px;padding:18px 0 6px}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <header class="nav"><div class="nav-row" id="nav"></div></header>
  <main id="view"></main>
  <footer id="dock" hidden></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===========================================================
   Bankwacht — speeltijd en banktijd bij hockey
   Gemaakt voor Anneliese van KHC Dragons
   =========================================================== */
const APP_VERSION = "2.2.0";
const DATA_VERSION = 2;
const KEY = "bankwacht.v1";

let S = { v:DATA_VERSION, seasons:[], activeSeason:null, openMatch:null, lastBackup:null };

/* ---------- opslag ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.seasons)) S = Object.assign(S, p); }
  }catch(e){ console.warn("laden mislukt", e); }
  migrate();
}
function migrate(){
  if(S.v === DATA_VERSION) return;
  (S.seasons||[]).forEach(se=>{
    const r = {};
    Object.keys(se.roster||{}).forEach(n=>{
      const val = se.roster[n];
      r[n] = (typeof val === "string") ? { f:val, l:"" } : (val || { f:"", l:"" });
    });
    se.roster = r;
    (se.matches||[]).forEach(m=>{
      Object.values(m.players||{}).forEach(p=>{
        if(p.name !== undefined){ p.f = p.name; p.l = ""; delete p.name; }
        if(p.f === undefined) p.f = "";
        if(p.l === undefined) p.l = "";
        if(p.goals === undefined) p.goals = 0;
      });
    });
  });
  S.v = DATA_VERSION;
  save(true);
}
let saveT = null, saveFail = false;
function save(now){
  const go = ()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); saveFail = false; }
    catch(e){
      if(!saveFail){ saveFail = true; toast("Let op: bewaren lukt niet in deze browser"); }
      console.warn("bewaren mislukt", e);
    }
  };
  if(now){ clearTimeout(saveT); go(); return; }
  clearTimeout(saveT); saveT = setTimeout(go, 400);
}
window.addEventListener("pagehide", ()=> save(true));
window.addEventListener("beforeunload", ()=> save(true));
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(true); });
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- helpers ---------- */
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mmss(ms){ ms = Math.max(0, Math.round(ms/1000)); return Math.floor(ms/60) + ":" + String(ms%60).padStart(2,"0"); }
function hmm(ms){ const t = Math.max(0, Math.round(ms/1000)), h = Math.floor(t/3600), m = Math.floor(t%3600/60);
  return h > 0 ? h + "u" + String(m).padStart(2,"0") : m + " min"; }
function dateNL(iso){ if(!iso) return ""; const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("nl-BE",{day:"numeric",month:"short",year:"numeric"}); }
function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), ms || 1900);
}
function ordinalPart(i, total){
  if(total === 2) return (i===0?"1e":"2e") + " helft";
  if(total === 4) return "Q" + (i+1);
  return "Deel " + (i+1);
}
const svg = {
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="23" height="23"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 5l7 7-7 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.2-3.2M20 16H7l3.2 3.2"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2.2"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="21" height="21"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- geluid en trilling ---------- */
let AC = null;
function audioOn(){
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
  }catch(e){ AC = null; }
}
window.addEventListener("pointerdown", audioOn, { passive:true });
window.addEventListener("touchstart", audioOn, { passive:true });
function beeps(){
  if(!AC) return;
  try{
    const t0 = AC.currentTime;
    [[0,880],[0.30,880],[0.60,1320]].forEach(([off,f])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+off);
      g.gain.exponentialRampToValueAtTime(0.35, t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+off+0.26);
      o.connect(g); g.connect(AC.destination);
      o.start(t0+off); o.stop(t0+off+0.3);
    });
  }catch(e){}
}
function alarm(){
  try{ if(navigator.vibrate) navigator.vibrate([300,120,300,120,500]); }catch(e){}
  beeps();
}

/* ---------- model ---------- */
const CARD_DEF = { groen:{label:"Groene kaart", ms:120000}, geel:{label:"Gele kaart", ms:300000}, rood:{label:"Rode kaart", ms:null} };
function season(){ return S.seasons.find(s=>s.id===S.activeSeason) || null; }
function match(){ const se = season(); if(!se) return null; return se.matches.find(m=>m.id===S.openMatch) || null; }
function dispName(p){ return (p.f || "").trim() || ("speler " + p.n); }
function fullName(p){ return ((p.f||"") + " " + (p.l||"")).trim(); }

function newSeason(name, team){
  const s = { id:uid(), name, team, created:Date.now(), roster:{}, matches:[] };
  S.seasons.unshift(s); S.activeSeason = s.id; save(true); return s;
}
function newMatch(se, d){
  const m = { id:uid(), date:d.date, opponent:d.opponent, venue:d.venue,
    cfg:{ sport:d.sport, parts:d.parts, partMin:d.partMin, onField:d.onField },
    status:"live", created:Date.now(), appVersion:APP_VERSION,
    clock:{ part:0, parts:new Array(d.parts).fill(0), running:false, since:null },
    score:{ us:0, them:0 }, players:{}, log:[] };
  d.squad.forEach(p=>{
    m.players[p.n] = { n:p.n, f:p.f||"", l:p.l||"", status:p.start?"field":"bench",
      fieldMs:0, benchMs:0, suspMs:0, subs:0, since:0, longestBench:0, cards:[], susp:null, ready:false, goals:0 };
  });
  se.matches.unshift(m); return m;
}
function elapsedPart(m,i){ const c = m.clock, b = c.parts[i]||0;
  return (c.running && c.part===i && c.since) ? b + (Date.now()-c.since) : b; }
function elapsedTotal(m){ let t = 0; for(let i=0;i<m.clock.parts.length;i++) t += elapsedPart(m,i); return t; }
function liveOf(p,T){ const d = Math.max(0, T - p.since);
  return { field:p.fieldMs + (p.status==="field"?d:0), bench:p.benchMs + (p.status==="bench"?d:0),
           susp:p.suspMs + (p.status==="susp"?d:0), spell:d }; }
function commit(m,p,T){
  const d = Math.max(0, T - p.since);
  if(p.status==="field") p.fieldMs += d;
  else if(p.status==="bench"){ p.benchMs += d; if(d > p.longestBench) p.longestBench = d; }
  else if(p.status==="susp") p.suspMs += d;
  p.since = T;
}
function logEv(m, text){ m.log.push({ t:elapsedTotal(m), part:m.clock.part, wall:Date.now(), text }); }
function playersArr(m){ return Object.values(m.players).sort((a,b)=> (+a.n)-(+b.n) || String(a.n).localeCompare(String(b.n))); }
function onFieldNow(m){ return playersArr(m).filter(p=>p.status==="field"); }

/* ---------- acties ---------- */
function toggleClock(){
  const m = match(); if(!m) return;
  audioOn();
  const c = m.clock;
  if(c.running){ c.parts[c.part] = elapsedPart(m,c.part); c.running = false; c.since = null; logEv(m,"Klok gepauzeerd"); }
  else { c.since = Date.now(); c.running = true;
    logEv(m, c.parts[c.part]===0 ? ordinalPart(c.part,m.cfg.parts)+" gestart" : "Klok hervat"); }
  save(true); renderMatch();
}
function nudgeClock(ms){
  const m = match(); if(!m) return;
  const c = m.clock;
  c.parts[c.part] = Math.max(0, elapsedPart(m,c.part) + ms);
  if(c.running) c.since = Date.now();
  const T = elapsedTotal(m);
  playersArr(m).forEach(p=>{ if(p.since > T) p.since = T; });
  logEv(m, (ms>0?"+":"−") + (Math.abs(ms)>=60000 ? Math.abs(Math.round(ms/60000))+" min" : Math.abs(ms/1000)+" sec") + " op de klok");
  save(true); paint();
}
function endPart(){
  const m = match(); const c = m.clock;
  c.parts[c.part] = elapsedPart(m,c.part); c.running = false; c.since = null;
  logEv(m, "Einde " + ordinalPart(c.part,m.cfg.parts).toLowerCase());
  if(c.part < m.cfg.parts-1) c.part++;
  save(true); closeModal(); renderMatch();
}
function finishMatch(){
  const m = match(); const T = elapsedTotal(m);
  m.clock.parts[m.clock.part] = elapsedPart(m,m.clock.part);
  m.clock.running = false; m.clock.since = null;
  playersArr(m).forEach(p=> commit(m,p,T));
  m.status = "done"; m.totalMs = T;
  logEv(m, "Wedstrijd beëindigd — " + m.score.us + "–" + m.score.them);
  save(true); closeModal(); go("summary");
}
function sub(outN, inN){
  const m = match(); const T = elapsedTotal(m);
  const a = m.players[outN], b = m.players[inN];
  if(!a || !b) return;
  commit(m,a,T); commit(m,b,T);
  a.status = "bench"; b.status = "field"; b.ready = false;
  a.subs++; b.subs++;
  logEv(m, b.n + " " + dispName(b) + " in voor " + a.n + " " + dispName(a));
  save(true); renderMatch();
  toast(b.n + " in · " + a.n + " uit");
}
function giveCard(n, type){
  const m = match(); const T = elapsedTotal(m), p = m.players[n], def = CARD_DEF[type];
  commit(m,p,T);
  p.cards.push({ type, at:T });
  if(type === "rood"){ p.status = "out"; p.susp = null; }
  else { p.status = "susp"; p.susp = { type, until: T + def.ms }; }
  p.ready = false;
  logEv(m, def.label + " voor " + p.n + " " + dispName(p) + (def.ms ? " — " + (def.ms/60000) + " min" : ""));
  save(true); closeModal(); renderMatch();
}
function backFromSusp(n, toField){
  const m = match(); const T = elapsedTotal(m), p = m.players[n];
  commit(m,p,T); p.status = toField ? "field" : "bench"; p.susp = null; p.ready = false;
  logEv(m, p.n + " " + dispName(p) + " terug " + (toField ? "op het veld" : "op de bank"));
  save(true); closeModal(); renderMatch();
}
function goal(side, scorerN){
  const m = match(); const se = season();
  m.score[side]++;
  let txt = side==="us" ? "Doelpunt " + se.team : "Tegendoelpunt";
  if(scorerN){ const p = m.players[scorerN]; if(p){ p.goals = (p.goals||0)+1; txt += " — " + p.n + " " + dispName(p); } }
  logEv(m, txt + " (" + m.score.us + "–" + m.score.them + ")");
  save(true); closeModal(); renderMatch();
}
function unGoal(side, scorerN){
  const m = match(); if(m.score[side] <= 0) return;
  m.score[side]--;
  if(scorerN && m.players[scorerN] && m.players[scorerN].goals > 0) m.players[scorerN].goals--;
  logEv(m, "Doelpunt gecorrigeerd (" + m.score.us + "–" + m.score.them + ")");
  save(true); closeModal(); renderMatch();
}
function setName(n, f, l){
  const m = match(), se = season(), p = m.players[n];
  p.f = f.trim(); p.l = l.trim();
  se.roster[n] = { f:p.f, l:p.l };
  save(true); closeModal(); renderMatch();
}

function openModal(title, body, opts){
  closeModal(true);
  const scrim = document.createElement("div"); scrim.className = "scrim"; scrim.id = "scrim";
  const mo = document.createElement("div"); mo.className = "modal"; mo.id = "modal";
  mo.setAttribute("role","dialog"); mo.setAttribute("aria-modal","true");
  mo.innerHTML = '<div class="hdl"></div>' +
    (title ? '<div class="mh"><div style="width:44px"></div><div class="ttl">'+esc(title)+'</div><button class="nav-btn" data-x>'+svg.close+'</button></div>' : "") +
    '<div class="mb">' + body + '</div>';
  document.body.append(scrim, mo);
  requestAnimationFrame(()=>{ scrim.classList.add("on"); mo.classList.add("on"); });
  scrim.onclick = ()=> closeModal();
  const x = mo.querySelector("[data-x]"); if(x) x.onclick = ()=> closeModal();
  if(opts && opts.onMount) opts.onMount(mo);
}
function closeModal(instant){
  const sc = $("#scrim"), mo = $("#modal");
  if(!sc && !mo) return;
  if(instant){ sc&&sc.remove(); mo&&mo.remove(); return; }
  sc && sc.classList.remove("on"); mo && mo.classList.remove("on");
  setTimeout(()=>{ sc&&sc.remove(); mo&&mo.remove(); }, 260);
}

let carrySel = null;
function carryStart(newId){
  const others = S.seasons.filter(s=> s.id !== newId && Object.keys(s.roster||{}).length);
  if(!others.length){ go("season"); return; }
  if(others.length === 1){ carrySheet(newId, others[0].id); return; }
  let h = '<p class="muted">Uit welk seizoen wil je spelers overnemen?</p><div class="card">';
  others.forEach(s=>{
    h += '<button class="opt" onclick="carrySheet(\''+newId+'\',\''+s.id+'\')"><span style="flex:1">'+
      '<span style="display:block">'+esc(s.team)+'</span>'+
      '<span style="display:block;font-size:13px;color:var(--text2)">'+esc(s.name)+' · '+Object.keys(s.roster).length+' spelers</span></span>'+
      '<span class="chev">'+svg.chev+'</span></button>';
  });
  h += '</div><div class="pad"><button class="btn ghost" onclick="closeModal();go(\'season\')">Leeg beginnen</button></div>';
  openModal("Spelers overnemen", h);
}
function carrySheet(newId, srcId){
  const src = S.seasons.find(s=>s.id===srcId);
  if(!src){ go("season"); return; }
  const ns = Object.keys(src.roster).sort((a,b)=>a-b);
  carrySel = new Set(ns);
  let h = '<p class="muted">Kies wie mee overgaat naar het nieuwe seizoen. Je kan later altijd nummers bijzetten.</p>';
  h += '<div class="pad" style="padding-bottom:8px;display:flex;gap:8px">'+
       '<button class="btn ghost" id="cAll" style="height:40px;font-size:15px">Allemaal</button>'+
       '<button class="btn ghost" id="cNone" style="height:40px;font-size:15px">Geen</button></div>';
  h += '<div class="card">';
  ns.forEach(n=>{
    const r = src.roster[n] || {};
    h += '<button class="opt" data-n="'+esc(n)+'" style="background:var(--tint-soft)">'+
      '<span class="badge num">'+esc(n)+'</span>'+
      '<span style="flex:1">'+esc(((r.f||"") + " " + (r.l||"")).trim() || "geen naam")+'</span>'+
      '<span class="mk" style="color:var(--tint);font-weight:700;font-size:18px;width:20px;text-align:center">✓</span></button>';
  });
  h += '</div><div class="pad"><button class="btn" id="cGo"></button></div>'+
       '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal();go(\'season\')">Leeg beginnen</button></div>';
  openModal("Spelers overnemen", h, { onMount(mo){
    const upd = ()=>{
      mo.querySelector("#cGo").textContent = carrySel.size
        ? carrySel.size + " speler" + (carrySel.size===1?"":"s") + " overnemen"
        : "Niemand overnemen";
      mo.querySelectorAll("[data-n]").forEach(el=>{
        const on = carrySel.has(el.dataset.n);
        el.style.background = on ? "var(--tint-soft)" : "var(--surface)";
        el.querySelector(".mk").textContent = on ? "✓" : "";
      });
    };
    mo.querySelectorAll("[data-n]").forEach(el=> el.onclick = ()=>{
      const n = el.dataset.n;
      if(carrySel.has(n)) carrySel.delete(n); else carrySel.add(n);
      upd();
    });
    mo.querySelector("#cAll").onclick  = ()=>{ ns.forEach(n=>carrySel.add(n)); upd(); };
    mo.querySelector("#cNone").onclick = ()=>{ carrySel.clear(); upd(); };
    mo.querySelector("#cGo").onclick   = ()=> carryDo(newId, srcId);
    upd();
  }});
}
function carryDo(newId, srcId){
  const dst = S.seasons.find(s=>s.id===newId), src = S.seasons.find(s=>s.id===srcId);
  let k = 0;
  if(dst && src){
    carrySel.forEach(n=>{ const r = src.roster[n]; if(r){ dst.roster[n] = { f:r.f||"", l:r.l||"" }; k++; } });
  }
  save(true); closeModal(); go("season");
  if(k) toast(k + " speler" + (k===1?"":"s") + " overgenomen");
}

      (se.matches.length ? '<button class="nav-btn txt" onclick="seasonEdit=!seasonEdit;renderSeason()">'+(seasonEdit?"Klaar":"Wijzig")+'</button>' : '<div style="width:44px"></div>'));
  let h = '<div class="pad"><button class="btn" onclick="go(\'setup\')">Nieuwe wedstrijd</button></div>';
  const live = se.matches.filter(m=>m.status==="live"), done = se.matches.filter(m=>m.status!=="live");
  if(live.length){ h += '<div class="sec">Loopt nu</div><div class="card">' + live.map(matchRow).join("") + '</div>'; }
  h += '<div class="sec">Wedstrijden</div>';
  if(!done.length && !live.length) h += '<div class="empty">Nog geen wedstrijden in dit seizoen.</div>';
  else if(done.length) h += '<div class="card">' + done.map(matchRow).join("") + '</div>';
  h += '<div class="ver">Bankwacht '+APP_VERSION+'</div>';
  $("#view").innerHTML = h;
}
function matchRow(m){
  const vs = (m.venue==="home" ? "thuis tegen " : "uit bij ") + (m.opponent || "onbekend");
  const sc = m.status==="live" ? "loopt" : (m.score.us + "–" + m.score.them);
  return '<div class="row" style="padding-right:8px">'+
    (seasonEdit ? '<button onclick="askDelMatch(\''+m.id+'\')" style="color:#fff;background:var(--danger);width:28px;height:28px;border-radius:99px;font-weight:700;flex:0 0 28px">−</button>' : '')+
    '<button style="flex:1;display:flex;align-items:center;gap:12px;text-align:left" onclick="openMatch(\''+m.id+'\')">'+
    '<span style="flex:1;min-width:0"><span class="t" style="display:block">'+esc(vs)+'</span>'+
    '<span class="s" style="display:block">'+esc(dateNL(m.date))+(m.status==="live"?' · <span style="color:var(--tint);font-weight:600">bezig</span>':'')+'</span></span>'+
    '<span class="v num" style="font-weight:600;color:var(--text)">'+sc+'</span><span class="chev">'+svg.chev+'</span></button></div>';
}
function openMatch(id){ S.openMatch = id; save(true); const m = match(); go(m && m.status==="live" ? "match" : "summary"); }
function askDelMatch(id){
  const se = season(), m = se.matches.find(x=>x.id===id); if(!m) return;
  openModal("Wedstrijd verwijderen",
    '<p class="muted">Je verwijdert de wedstrijd van '+esc(dateNL(m.date))+' tegen '+esc(m.opponent||"onbekend")+', met alle tijden en de log. Dit kan niet ongedaan gemaakt worden.</p>'+
    '<div class="pad"><button class="btn dngr" onclick="delMatch(\''+id+'\')">Definitief verwijderen</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Annuleren</button></div>');
}
function delMatch(id){
  const se = season();
  se.matches = se.matches.filter(x=>x.id!==id);
  if(S.openMatch === id) S.openMatch = null;
  save(true); closeModal(); go("season"); toast("Wedstrijd verwijderd");
}

/* ---------- wedstrijd opzetten ---------- */
let setupState = null;
function renderSetup(){
  const se = season(); if(!se) return go("home");
  if(!setupState){
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    setupState = { date:d.toISOString().slice(0,10), opponent:"", venue:"home",
      sport:"hockey", parts:2, partMin:35, onField:11, adv:false,
      squad: Object.keys(se.roster).sort((a,b)=>a-b).map(n=>({ n, f:(se.roster[n]||{}).f||"", l:(se.roster[n]||{}).l||"", in:false, start:false })) };
  }
  const st = setupState;
  nav(backBtn("season") + navTitle("Nieuwe wedstrijd") + '<div style="width:44px"></div>');

  let h = '<div class="sec">Wedstrijd</div><div class="card">';
  h += '<div class="row"><label class="lbl" for="opp">Tegenstander</label><input type="text" id="opp" value="'+esc(st.opponent)+'" placeholder="clubnaam" autocomplete="off"></div>';
  h += '<div class="row"><label class="lbl" for="dt">Datum</label><input type="date" id="dt" value="'+st.date+'"></div>';
  h += '<div class="row"><div class="grow"><div class="t">Waar</div></div><div class="seg" style="width:168px">'+
       '<button aria-pressed="'+(st.venue==="home")+'" onclick="setupSet(\'venue\',\'home\')">Thuis</button>'+
       '<button aria-pressed="'+(st.venue==="away")+'" onclick="setupSet(\'venue\',\'away\')">Uit</button></div></div>';
  h += '<div class="row"><div class="grow"><div class="t">Duur per deel</div><div class="s">minuten</div></div>'+stepper("partMin",st.partMin,5,5,60)+'</div></div>';

  h += '<div class="sec">Selectie van vandaag</div>';
  h += '<p class="muted" style="margin-top:0">Tik een rugnummer aan om de speler te selecteren. De eerste '+st.onField+' worden basis, de rest bank. Tik op het label om dat om te draaien.</p>';
  h += '<div class="card" id="squadList">';
  st.squad.forEach((p,i)=> h += squadRowHTML(p,i));
  h += '<div class="row" id="addRow"><input type="tel" id="newNr" inputmode="numeric" placeholder="rugnummer, dan Enter" style="text-align:left" autocomplete="off">'+
       '<button onclick="setupAdd()" style="color:var(--tint);font-weight:600;padding:8px 10px">Voeg toe</button></div></div>';
  h += '<p class="muted" id="cnt"></p>';

  h += '<div class="sec">Geavanceerde wedstrijdinstellingen</div><div class="card">';
  if(!st.adv){
    h += '<button class="row" onclick="setupSet(\'adv\',true)"><div class="grow"><div class="t">Tonen</div><div class="s">'+
         (st.sport==="hockey"?"Hockey":"Voetbal")+' · '+st.parts+' delen · '+st.onField+' spelers</div></div><span class="chev">'+svg.chev+'</span></button>';
  }else{
    h += '<div class="row"><div class="grow"><div class="t">Sport</div></div><div class="seg" style="width:190px">'+
      '<button aria-pressed="'+(st.sport==="hockey")+'" onclick="setupSet(\'sport\',\'hockey\')">Hockey</button>'+
      '<button aria-pressed="'+(st.sport==="voetbal")+'" onclick="setupSet(\'sport\',\'voetbal\')">Voetbal</button></div></div>';
    h += '<div class="row"><div class="grow"><div class="t">Aantal delen</div></div>'+stepper("parts",st.parts,1,1,4)+'</div>';
    h += '<div class="row"><div class="grow"><div class="t">Spelers op het veld</div></div>'+stepper("onField",st.onField,1,3,15)+'</div>';
  }
  h += '</div>';
  h += '<div class="pad" id="goWrap"></div>';
  $("#view").innerHTML = h;

  $("#opp").oninput = e=>{ st.opponent = e.target.value; };
  $("#dt").oninput  = e=>{ st.date = e.target.value; };
  const nn = $("#newNr");
  nn.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); setupAdd(); } });
  refreshSetupFooter();
}
function squadRowHTML(p,i){
  const lbl = !p.in ? "niet geselecteerd" : (p.start ? "basis" : "bank");
  const sty = !p.in ? "background:var(--fill);color:var(--text3)"
            : (p.start ? "background:var(--tint-soft);color:var(--tint)" : "background:var(--bench-soft);color:var(--bench)");
  return '<div class="row" data-idx="'+i+'">'+
    '<button onclick="setupToggle('+i+')" style="flex:0 0 36px;height:36px;border-radius:10px;font-weight:700;font-size:16px;'+
      (p.in?'background:var(--tint);color:#fff':'background:var(--fill);color:var(--text2)')+'">'+esc(p.n)+'</button>'+
    '<input type="text" value="'+esc(p.f)+'" placeholder="voornaam" style="text-align:left;min-width:40px" oninput="setupName('+i+',this.value)" autocomplete="off">'+
    '<button onclick="setupRole('+i+')" style="flex:0 0 auto;font-size:12.5px;font-weight:600;padding:7px 9px;border-radius:9px;white-space:nowrap;'+sty+'">'+lbl+'</button></div>';
}
function refreshSetupFooter(){
  const st = setupState;
  const chosen = st.squad.filter(p=>p.in).length, starters = st.squad.filter(p=>p.in&&p.start).length;
  const c = $("#cnt"); if(c) c.textContent = chosen + " aanwezig · " + starters + " van de " + st.onField + " in de basis";
  const ok = chosen >= st.onField && starters === st.onField;
  const w = $("#goWrap");
  if(w) w.innerHTML = '<button class="btn" '+(ok?"":"disabled")+' onclick="startMatch()">Wedstrijd aanmaken</button>'+
    (ok?"":'<p class="muted" style="text-align:center;padding-top:10px">Duid '+st.onField+' basisspelers aan om te kunnen starten.</p>');
}
function stepper(k,v,step,min,max){
  return '<div class="stepper"><button onclick="setupStep(\''+k+'\',-'+step+','+min+','+max+')">−</button><span class="num">'+v+'</span>'+
         '<button onclick="setupStep(\''+k+'\','+step+','+min+','+max+')">+</button></div>';
}
function setupStep(k,d,min,max){ setupState[k] = Math.min(max, Math.max(min, setupState[k]+d)); renderSetup(); }
function setupSet(k,v){ setupState[k] = v; renderSetup(); }
function starterCount(){ return setupState.squad.filter(x=>x.in && x.start).length; }
function autoRole(p){ p.start = starterCount() < setupState.onField; }
function setupToggle(i){
  const p = setupState.squad[i];
  p.in = !p.in;
  if(p.in) autoRole(p); else p.start = false;
  redrawSquadRow(i);
}
function setupRole(i){
  const p = setupState.squad[i];
  if(!p.in){ p.in = true; autoRole(p); redrawSquadRow(i); return; }
  if(!p.start && starterCount() >= setupState.onField){ toast("Al " + setupState.onField + " basisspelers gekozen"); return; }
  p.start = !p.start;
  redrawSquadRow(i);
}
function redrawSquadRow(i){
  const row = document.querySelector('#squadList .row[data-idx="'+i+'"]');
  if(row){ row.outerHTML = squadRowHTML(setupState.squad[i], i); }
  refreshSetupFooter();
}
function setupName(i,v){ setupState.squad[i].f = v; }
function setupAdd(){
  const el = $("#newNr"), n = (el.value||"").trim();
  if(!n){ el.focus(); return; }
  if(setupState.squad.some(p=>String(p.n)===n)){ toast("Nummer " + n + " staat er al"); el.value = ""; el.focus(); return; }
  const se = season(), r = se.roster[n] || {};
  const np = { n, f:r.f||"", l:r.l||"", in:true, start:false };
  setupState.squad.push(np);
  autoRole(np);
  const i = setupState.squad.length - 1;
  $("#addRow").insertAdjacentHTML("beforebegin", squadRowHTML(setupState.squad[i], i));
  el.value = ""; el.focus();
  refreshSetupFooter();
}
function startMatch(){
  const se = season(), st = setupState;
  const squad = st.squad.filter(p=>p.in).map(p=>({ n:p.n, f:(p.f||"").trim(), l:(p.l||"").trim(), start:p.start }));
  squad.forEach(p=>{ se.roster[p.n] = { f:p.f, l:p.l || ((se.roster[p.n]||{}).l || "") }; });
  const m = newMatch(se, { date:st.date, opponent:(st.opponent||"").trim(), venue:st.venue,
    sport:st.sport, parts:st.parts, partMin:st.partMin, onField:st.onField, squad });
  logEv(m, "Wedstrijdblad klaar — " + squad.length + " spelers");
  S.openMatch = m.id; setupState = null; save(true); go("match");
}

/* ---------- wedstrijdscherm ---------- */
function renderMatch(){
  const m = match(), se = season();
  if(!m) return go("season");
  if(m.status !== "live") return go("summary");
  const us = se.team, them = m.opponent || "Tegenstander";
  const left = m.venue==="home" ? us : them, right = m.venue==="home" ? them : us;
  const lS = m.venue==="home" ? "us" : "them", rS = m.venue==="home" ? "them" : "us";

  nav(menuBtn() + navTitle(us + " – " + them, dateNL(m.date) + " · " + (m.venue==="home"?"thuis":"uit"), "editMatchNames()") +
      '<button class="nav-btn txt" onclick="moreSheet()">Meer</button>');

  let h = '<div class="score"><div class="score-top">';
  h += '<button class="score-side" onclick="goalSheet(\''+lS+'\')"><div class="nm">'+esc(left)+'</div><div class="pt num" data-sc="'+lS+'">'+m.score[lS]+'</div></button>';
  h += '<div class="score-mid"><div class="clock num" id="clk">0:00</div><div class="clock-sub" id="clksub"></div><div id="clkpill"></div></div>';
  h += '<button class="score-side" onclick="goalSheet(\''+rS+'\')"><div class="nm">'+esc(right)+'</div><div class="pt num" data-sc="'+rS+'">'+m.score[rS]+'</div></button>';
  h += '</div></div>';

  h += '<div class="sheet-scroll"><div class="grid">';
  playersArr(m).forEach(p=>{
    const cc = p.status==="susp" && p.susp ? " c-"+p.susp.type : "";
    h += '<button class="pl '+p.status+cc+'" data-p="'+esc(p.n)+'" onclick="playerSheet(\''+esc(p.n)+'\')">'+
      '<span class="badge-wrap"><span class="n num">'+esc(p.n)+'</span>'+
        '<span class="goalbub num" data-g="'+esc(p.n)+'" '+(p.goals?'':'hidden')+'>'+(p.goals||0)+'</span></span>'+
      '<span class="info"><span class="nm">'+esc(dispName(p))+'</span>'+
        '<span class="tm num"><b data-f="'+esc(p.n)+'">0:00</b><span class="bb" data-b="'+esc(p.n)+'">0:00</span></span>'+
        '<span class="now num" data-now="'+esc(p.n)+'" hidden></span></span>'+
      '<span class="subcount num" data-s="'+esc(p.n)+'">'+p.subs+'</span></button>';
  });
  h += '</div></div><div class="strip" id="strip"></div>';
  $("#view").innerHTML = h;

  const dock = $("#dock"); dock.hidden = false; dock.className = "dock";
  dock.innerHTML =
    '<button class="act '+(m.clock.running?"stop":"primary")+'" onclick="toggleClock()">'+(m.clock.running?svg.pause:svg.play)+
      '<span>'+(m.clock.running?"Pauze":(m.clock.parts[m.clock.part]?"Hervat":"Start"))+'</span></button>'+
    '<button class="act" onclick="subSheet()">'+svg.swap+'<span>Wissel</span></button>'+
    '<button class="act" onclick="cardSheet()">'+svg.card+'<span>Kaart</span></button>'+
    '<button class="act" onclick="moreSheet()">'+svg.more+'<span>Meer</span></button>';
  paint();
}

function paint(){
  const m = match(); if(!m || VIEW !== "match") return;
  const T = elapsedTotal(m), c = m.clock, partMs = elapsedPart(m,c.part), limit = m.cfg.partMin*60000;
  const clk = $("#clk");
  if(!clk) return;
  clk.textContent = mmss(partMs);
  clk.className = "clock num" + (partMs >= limit ? " over" : (c.running ? "" : " idle"));
  $("#clksub").textContent = ordinalPart(c.part, m.cfg.parts) + " · totaal " + mmss(T);
  const over = partMs >= limit;
  $("#clkpill").innerHTML = c.running ? '<span class="pill live">'+(over?"verlenging":"loopt")+'</span>'
    : '<span class="pill '+(partMs?"paused":"")+'">'+(partMs ? (over?"tijd om":"stil") : "klaar om te starten")+'</span>';

  let fired = null;
  playersArr(m).forEach(p=>{
    if(p.status === "susp" && p.susp && T >= p.susp.until){
      const until = p.susp.until;
      commit(m,p,until); p.status = "field"; p.since = until; p.ready = true; p.susp = null;
      logEv(m, p.n + " " + dispName(p) + " straf afgelopen — terug het veld in");
      fired = p;
    }
    if(p.ready && p.status === "field" && T - p.since > 12000) p.ready = false;
    const L = liveOf(p,T), q = s=> document.querySelector('['+s+'="'+CSS.escape(String(p.n))+'"]');
    const f = q("data-f"), b = q("data-b"), now = q("data-now"), sc = q("data-s"), gb = q("data-g");
    if(f) f.textContent = mmss(L.field);
    if(b) b.textContent = mmss(L.bench);
    if(sc) sc.textContent = p.subs;
    if(gb){ gb.hidden = !p.goals; gb.textContent = p.goals || 0; }
    if(now){
      if(p.status === "bench"){ now.hidden = false; now.className = "now num"; now.textContent = "nu " + mmss(L.spell); }
      else if(p.status === "susp" && p.susp){ now.hidden = false; now.className = "now num sus"; now.textContent = "straf " + mmss(Math.max(0, p.susp.until - T)); }
      else now.hidden = true;
    }
    const card = document.querySelector('.pl[data-p="'+CSS.escape(String(p.n))+'"]');
    if(card){
      const want = "pl " + p.status + (p.status==="susp" && p.susp ? " c-"+p.susp.type : "") + (p.ready && p.status==="field" ? " ready" : "");
      if(card.className !== want) card.className = want;
    }
  });
  if(fired){ save(true); alarm(); toast("Straf afgelopen — " + fired.n + " " + dispName(fired) + " staat weer op het veld", 4600); }

  const strip = $("#strip");
  const bench = playersArr(m).filter(p=>p.status==="bench");
  const susp  = playersArr(m).filter(p=>p.status==="susp");
  const sig = susp.map(p=>p.n+p.susp.type).join()+"|"+bench.map(p=>p.n+(p.ready?"r":"")).join();
  if(strip.dataset.sig !== sig){
    strip.dataset.sig = sig;
    let sh = "";
    if(susp.length){
      sh += '<h6>Straftijd</h6><div class="chips">' + susp.map(p=>
        '<button class="chip sus c-'+p.susp.type+'" onclick="playerSheet(\''+esc(p.n)+'\')"><b class="num">'+esc(p.n)+'</b><span class="tt">0:00</span></button>').join("") + '</div>';
    }
    sh += '<h6>Bank — ' + bench.length + '</h6><div class="chips">';
    sh += bench.length ? bench.map(p=>
      '<button class="chip bench'+(p.ready?" ready":"")+'" onclick="playerSheet(\''+esc(p.n)+'\')"><b class="num">'+esc(p.n)+'</b><span class="tt">0:00</span></button>').join("")
      : '<span class="chip-empty">Niemand op de bank.</span>';
    sh += '</div>';
    strip.innerHTML = sh;
  }
  const chips = strip.querySelectorAll(".chip");
  let i = 0;
  susp.forEach(p=>{ const el = chips[i++]; if(el) el.querySelector(".tt").textContent = mmss(Math.max(0, p.susp.until - T)); });
  bench.forEach(p=>{ const el = chips[i++]; if(el) el.querySelector(".tt").textContent = mmss(liveOf(p,T).spell); });
  document.querySelectorAll("[data-sc]").forEach(el=>{ el.textContent = m.score[el.dataset.sc]; });
}

/* ---------- speler ---------- */
function playerSheet(n){
  const m = match(), p = m.players[n], T = elapsedTotal(m), L = liveOf(p,T);
  let h = '<div class="card" style="margin-bottom:14px">';
  h += '<button class="row" onclick="nameSheet(\''+esc(p.n)+'\')"><div class="grow"><div class="t">'+esc(fullName(p) || "naam toevoegen")+'</div></div><span style="color:var(--tint)">'+svg.pen+'</span></button>';
  h += '<div class="row"><div class="grow"><div class="t">Op het veld</div></div><div class="v num" style="color:var(--tint);font-weight:600">'+mmss(L.field)+'</div></div>';
  h += '<div class="row"><div class="grow"><div class="t">Op de bank</div>'+(p.status==="bench"?'<div class="s">deze beurt '+mmss(L.spell)+'</div>':'')+
       '</div><div class="v num" style="color:var(--bench);font-weight:600">'+mmss(L.bench)+'</div></div>';
  h += '<div class="row"><div class="grow"><div class="t">Keer gewisseld</div></div><div class="v num">'+p.subs+'</div></div>';
  if(p.goals) h += '<div class="row"><div class="grow"><div class="t">Doelpunten</div></div><div class="v num">'+p.goals+'</div></div>';
  if(p.cards.length) h += '<div class="row"><div class="grow"><div class="t">Kaarten</div></div><div class="v">'+p.cards.map(c=>CARD_DEF[c.type].label.split(" ")[0]).join(", ")+'</div></div>';
  h += '</div>';

  if(p.status === "field"){
    const bench = playersArr(m).filter(x=>x.status==="bench");
    h += '<div class="sec">Vervangen door</div><div class="card">';
    if(!bench.length) h += '<div class="row"><div class="s">Niemand beschikbaar op de bank.</div></div>';
    bench.forEach(b=>{
      const BL = liveOf(b,T);
      h += '<button class="opt" onclick="sub(\''+esc(p.n)+'\',\''+esc(b.n)+'\');closeModal()"><span class="badge b num">'+esc(b.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(b))+'</span><span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(BL.spell)+' op de bank</span></span>'+
        (b.ready?'<span style="font-size:12px;color:var(--tint);font-weight:600">straf uit</span>':'')+'</button>';
    });
    h += '</div>';
  } else if(p.status === "bench"){
    h += '<div class="sec">Brengt wie naar de bank?</div><div class="card">';
    onFieldNow(m).forEach(f=>{
      const FL = liveOf(f,T);
      h += '<button class="opt" onclick="sub(\''+esc(f.n)+'\',\''+esc(p.n)+'\');closeModal()"><span class="badge f num">'+esc(f.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(f))+'</span><span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(FL.field)+' gespeeld</span></span></button>';
    });
    h += '</div>';
  } else if(p.status === "susp"){
    h += '<div class="sec">Straf — nog '+mmss(Math.max(0,p.susp.until-T))+'</div><div class="card">'+
      '<button class="opt" onclick="backFromSusp(\''+esc(p.n)+'\',true)"><span style="flex:1">Straf beëindigen, terug het veld in</span></button>'+
      '<button class="opt" onclick="backFromSusp(\''+esc(p.n)+'\',false)"><span style="flex:1">Straf beëindigen, naar de bank</span></button></div>';
  } else {
    h += '<div class="sec">Rode kaart</div><div class="card"><div class="row"><div class="s">Deze speler doet niet meer mee.</div></div></div>';
  }

  if(p.status !== "out"){
    h += '<div class="sec">Kaart geven</div><div class="card">';
    ["groen","geel","rood"].forEach(t=>{
      const d = CARD_DEF[t];
      h += '<button class="opt" onclick="giveCard(\''+esc(p.n)+'\',\''+t+'\')"><span class="dot '+t+'"></span><span style="flex:1">'+d.label+'</span>'+
        '<span style="color:var(--text2);font-size:14px">'+(d.ms?(d.ms/60000)+" min":"rest van de wedstrijd")+'</span></button>';
    });
    h += '</div>';
  }
  h += '<div style="height:10px"></div>';
  openModal(p.n + (fullName(p) ? " · " + dispName(p) : ""), h);
}
function nameSheet(n){
  const m = match(), p = m.players[n];
  openModal("Naam van nummer " + p.n,
    '<div class="card"><div class="row"><label class="lbl" for="nf">Voornaam</label><input type="text" id="nf" value="'+esc(p.f)+'" placeholder="Anneliese" autocomplete="off"></div>'+
    '<div class="row"><label class="lbl" for="nl">Achternaam</label><input type="text" id="nl" value="'+esc(p.l)+'" placeholder="optioneel" autocomplete="off"></div></div>'+
    '<p class="muted">Op de spelerkaart staat enkel de voornaam.</p>'+
    '<div class="pad"><button class="btn" id="nGo">Bewaren</button></div>',
    { onMount(mo){
        const f = mo.querySelector("#nf"), l = mo.querySelector("#nl");
        const fire = ()=> setName(n, f.value, l.value);
        mo.querySelector("#nGo").onclick = fire;
        [f,l].forEach(el=> el.addEventListener("keydown", e=>{ if(e.key === "Enter") fire(); }));
        setTimeout(()=>{ try{ f.focus(); }catch(e){} }, 220);
      }});
}

/* ---------- wisselen in twee stappen ---------- */
let subOff = null;
function subSheet(){ subOff = null; drawSubSheet(); }
function drawSubSheet(){
  const m = match(), T = elapsedTotal(m);
  if(!subOff){
    const field = onFieldNow(m);
    const bench = playersArr(m).filter(p=>p.status==="bench");
    if(!bench.length){ toast("Niemand op de bank"); return; }
    let h = '<p class="muted">Stap 1 van 2 — wie gaat van het veld?</p><div class="card">';
    field.forEach(f=>{
      const L = liveOf(f,T);
      h += '<button class="opt" onclick="pickOff(\''+esc(f.n)+'\')"><span class="badge f num">'+esc(f.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(f))+'</span>'+
        '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(L.field)+' gespeeld · '+f.subs+' wissels</span></span>'+
        '<span class="chev">'+svg.chev+'</span></button>';
    });
    h += '</div><div style="height:12px"></div>';
    openModal("Wissel", h);
  }else{
    const p = m.players[subOff];
    const bench = playersArr(m).filter(x=>x.status==="bench");
    let h = '<p class="muted">Stap 2 van 2 — wie komt erin voor '+esc(p.n)+' '+esc(dispName(p))+'?</p><div class="card">';
    bench.forEach(b=>{
      const L = liveOf(b,T);
      h += '<button class="opt" onclick="doSub(\''+esc(b.n)+'\')"><span class="badge b num">'+esc(b.n)+'</span>'+
        '<span style="flex:1"><span style="display:block">'+esc(dispName(b))+'</span>'+
        '<span style="display:block;font-size:13px;color:var(--text2)" class="num">'+mmss(L.spell)+' op de bank · totaal '+mmss(L.bench)+'</span></span>'+
        (b.ready?'<span style="font-size:12px;color:var(--tint);font-weight:600">straf uit</span>':'')+'</button>';
    });
    h += '</div><div class="pad"><button class="btn ghost" onclick="subSheet()">Terug</button></div>';
    openModal("Wissel", h);
  }
}
function pickOff(n){ subOff = n; drawSubSheet(); }
function doSub(inN){ const off = subOff; subOff = null; closeModal(); sub(off, inN); }

function cardSheet(){
  const m = match();
  const cands = playersArr(m).filter(p=>p.status==="field" || p.status==="bench");
  let h = '<p class="muted">Kies de speler, daarna de kaart.</p><div class="card">';
  cands.forEach(p=>{
    h += '<button class="opt" onclick="playerSheet(\''+esc(p.n)+'\')"><span class="badge '+(p.status==="field"?"f":"b")+' num">'+esc(p.n)+'</span>'+
      '<span style="flex:1">'+esc(dispName(p))+'</span><span style="font-size:13px;color:var(--text2)">'+(p.status==="field"?"veld":"bank")+'</span></button>';
  });
  h += '</div><div style="height:12px"></div>';
  openModal("Kaart geven", h);
}
function goalSheet(side){
  const m = match(), se = season(), ours = side === "us";
  let h = "";
  if(ours){
    h += '<div class="sec">Wie scoorde?</div><div class="card">';
    onFieldNow(m).forEach(p=>{
      h += '<button class="opt" onclick="goal(\'us\',\''+esc(p.n)+'\')"><span class="badge f num">'+esc(p.n)+'</span>'+
        '<span style="flex:1">'+esc(dispName(p))+'</span>'+(p.goals?'<span class="num" style="color:var(--cg);font-weight:700">'+p.goals+'</span>':'')+'</button>';
    });
    h += '<button class="opt" onclick="goal(\'us\')"><span class="badge">?</span><span style="flex:1">Zonder speler noteren</span></button></div>';
  }else{
    h += '<div class="pad"><button class="btn" onclick="goal(\'them\')">Tegendoelpunt noteren</button></div>';
  }
  h += '<div class="pad" style="padding-top:4px"><button class="btn ghost" onclick="unGoal(\''+side+'\')">Eén doelpunt terugnemen</button></div>';
  openModal(ours ? "Doelpunt " + se.team : "Doelpunt tegenstander", h);
}
function moreSheet(){
  const m = match(), part = ordinalPart(m.clock.part, m.cfg.parts).toLowerCase();
  let h = '<div class="sec">Klok bijstellen</div><div class="card">';
  h += '<button class="opt" onclick="nudgeClock(60000);closeModal()"><span style="flex:1">Eén minuut bijtellen</span><span style="color:var(--text2);font-size:14px">te laat gestart</span></button>';
  h += '<button class="opt" onclick="nudgeClock(-60000);closeModal()"><span style="flex:1">Eén minuut aftrekken</span><span style="color:var(--text2);font-size:14px">te vroeg gestart</span></button>';
  h += '<button class="opt" onclick="nudgeClock(10000);closeModal()"><span style="flex:1">Tien seconden bijtellen</span></button>';
  h += '<button class="opt" onclick="nudgeClock(-10000);closeModal()"><span style="flex:1">Tien seconden aftrekken</span></button></div>';
  h += '<div class="sec">Wedstrijd</div><div class="card">';
  if(m.clock.part < m.cfg.parts-1)
    h += '<button class="opt" onclick="endPart()"><span style="flex:1">Einde '+part+'</span><span style="color:var(--text2);font-size:14px">volgende deel klaarzetten</span></button>';
  h += '<button class="opt" onclick="confirmFinish()"><span style="flex:1;color:var(--danger)">Wedstrijd beëindigen</span></button></div>';
  const last = m.log.slice(-6).reverse();
  if(last.length){
    h += '<div class="sec">Laatste gebeurtenissen</div><div class="card">';
    last.forEach(l=> h += '<div class="logline"><span class="lt num">'+mmss(l.t)+'</span><span>'+esc(l.text)+'</span></div>');
    h += '</div>';
  }
  h += '<div class="ver">Bankwacht '+APP_VERSION+'</div>';
  openModal("Meer", h);
}
function confirmFinish(){
  const m = match();
  openModal("Wedstrijd beëindigen",
    '<p class="muted">De klok stopt en alle tijden worden vastgezet.</p>'+
    '<div class="pad"><button class="btn dngr" onclick="finishMatch()">Beëindigen op '+m.score.us+'–'+m.score.them+'</button></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn ghost" onclick="closeModal()">Toch niet</button></div>');
}

/* ---------- overzicht ---------- */
function renderSummary(){
  const m = match(), se = season();
  if(!m) return go("season");
  nav(backBtn("season") + navTitle(se.team + " – " + (m.opponent||"?"), dateNL(m.date), "editMatchNames()") + '<div style="width:44px"></div>');
  const T = m.totalMs != null ? m.totalMs : elapsedTotal(m), ps = playersArr(m);
  let h = '<div class="pad" style="text-align:center;padding-bottom:6px">'+
    '<div class="num" style="font-size:44px;font-weight:700;letter-spacing:-.03em">'+m.score.us+'–'+m.score.them+'</div>'+
    '<div style="color:var(--text2);font-size:14px">'+(m.venue==="home"?"thuis":"uit")+' · '+hmm(T)+' effectieve speeltijd</div></div>';
  h += '<div class="sec">Per speler</div><div class="card"><table class="st"><thead><tr><th>Speler</th><th>Veld</th><th>Bank</th><th>W</th><th>D</th></tr></thead><tbody>';
  ps.forEach(p=>{
    const L = liveOf(p,T);
    h += '<tr><td><b class="num">'+esc(p.n)+'</b> '+esc(dispName(p))+'</td>'+
      '<td class="num" style="color:var(--tint);font-weight:600">'+mmss(L.field)+'</td>'+
      '<td class="num" style="color:var(--bench)">'+mmss(L.bench)+'</td>'+
      '<td class="num">'+p.subs+'</td><td class="num">'+(p.goals||"")+'</td></tr>';
  });
  h += '</tbody></table></div><p class="muted">W = wissels, D = doelpunten.</p>';
  const lb = ps.map(p=>({ n:p.n, v:Math.max(p.longestBench, p.status==="bench"?liveOf(p,T).spell:0) })).sort((a,b)=>b.v-a.v)[0];
  if(lb && lb.v) h += '<p class="muted">Langste ononderbroken bankbeurt: '+esc(lb.n)+' met '+mmss(lb.v)+'.</p>';
  h += '<div class="sec">Wedstrijdverloop</div><div class="card">';
  if(!m.log.length) h += '<div class="row"><div class="s">Niets gelogd.</div></div>';
  m.log.forEach(l=> h += '<div class="logline"><span class="lt num">'+mmss(l.t)+'</span><span>'+esc(l.text)+'</span></div>');
  h += '</div>';
  if(m.status === "live") h += '<div class="pad"><button class="btn" onclick="go(\'match\')">Terug naar de wedstrijd</button></div>';
  h += '<div class="pad"><button class="btn ghost" onclick="shareMatch()">Overzicht delen</button></div>';
  h += '<div class="pad" style="padding-top:0"><button class="btn ghost" style="color:var(--danger)" onclick="askDelMatch(\''+m.id+'\')">Wedstrijd verwijderen</button></div>';
  $("#view").innerHTML = h;
}
function matchText(){
  const m = match(), se = season(), T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
  let t = se.team + " – " + (m.opponent||"?") + "  " + m.score.us + "–" + m.score.them + "\n" + dateNL(m.date) + "\n\n";
  playersArr(m).forEach(p=>{ const L = liveOf(p,T);
    t += p.n + " " + dispName(p) + " — veld " + mmss(L.field) + ", bank " + mmss(L.bench) + ", " + p.subs + " wissels" + (p.goals?", "+p.goals+" doelpunt"+(p.goals>1?"en":""):"") + "\n"; });
  return t;
}
async function shareMatch(){
  const txt = matchText();
  try{
    if(navigator.share){ await navigator.share({ title:"Wedstrijdoverzicht", text:txt }); return; }
    await navigator.clipboard.writeText(txt); toast("Gekopieerd");
  }catch(e){
    openModal("Overzicht", '<div class="pad"><textarea class="ta" readonly>'+esc(txt)+'</textarea></div>');
  }
}

/* ---------- seizoenstotalen ---------- */
function renderSeasonStats(){
  const se = season(); if(!se) return go("home");
  nav(backBtn("season") + navTitle("Seizoenstotalen", se.team) + '<div style="width:44px"></div>');
  const agg = {};
  se.matches.forEach(m=>{
    const T = m.totalMs != null ? m.totalMs : elapsedTotal(m);
    playersArr(m).forEach(p=>{
      const L = liveOf(p,T);
      const a = agg[p.n] || (agg[p.n] = { n:p.n, f:p.f || (se.roster[p.n]||{}).f || "", app:0, field:0, bench:0, subs:0, goals:0 });
      if(p.f) a.f = p.f;
      a.app++; a.field += L.field; a.bench += L.bench; a.subs += p.subs; a.goals += (p.goals||0);
    });
  });
  const rows = Object.values(agg).sort((a,b)=>(+a.n)-(+b.n));
  let h = '<p class="muted">Over '+se.matches.length+' wedstrijd'+(se.matches.length===1?"":"en")+'. Lopende wedstrijden tellen mee met hun stand van nu.</p>';
  if(!rows.length) h += '<div class="empty">Nog geen gegevens.</div>';
  else{
    h += '<div class="card"><table class="st"><thead><tr><th>Speler</th><th>W</th><th>Veld</th><th>Bank</th><th>D</th></tr></thead><tbody>';
    rows.forEach(a=> h += '<tr><td><b class="num">'+esc(a.n)+'</b> '+esc(a.f)+'</td><td class="num">'+a.app+'</td>'+
      '<td class="num" style="color:var(--tint);font-weight:600">'+hmm(a.field)+'</td>'+
      '<td class="num" style="color:var(--bench)">'+hmm(a.bench)+'</td><td class="num">'+(a.goals||"")+'</td></tr>');
    h += '</tbody></table></div><p class="muted">W = wedstrijden, D = doelpunten.</p>';
  }
  $("#view").innerHTML = h;
}

/* ---------- spelersbestand ---------- */
function editRoster(){
  const se = season(), ns = Object.keys(se.roster).sort((a,b)=>a-b);
  let h = '<p class="muted">Deze namen verschijnen automatisch als je een nieuwe wedstrijd aanmaakt.</p><div class="card">';
  if(!ns.length) h += '<div class="row"><div class="s">Nog leeg. Nummers en namen komen hier vanzelf in.</div></div>';
  ns.forEach(n=>{
    const r = se.roster[n] || {};
    h += '<div class="row"><span class="num" style="flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--fill);font-weight:700">'+esc(n)+'</span>'+
      '<input type="text" value="'+esc(r.f||"")+'" placeholder="voornaam" style="text-align:left" onchange="setRoster(\''+esc(n)+'\',\'f\',this.value)">'+
      '<input type="text" value="'+esc(r.l||"")+'" placeholder="achternaam" style="text-align:left;color:var(--text2)" onchange="setRoster(\''+esc(n)+'\',\'l\',this.value)">'+
      '<button onclick="delRoster(\''+esc(n)+'\')" style="color:var(--danger);font-size:14px;padding:8px">Wis</button></div>';
  });
  h += '</div><div style="height:14px"></div>';
  openModal("Spelersbestand", h);
}
function setRoster(n, k, v){ const se = season(); se.roster[n] = Object.assign({f:"",l:""}, se.roster[n]); se.roster[n][k] = v.trim(); save(true); }
function delRoster(n){ const se = season(); delete se.roster[n]; save(true); editRoster(); }

/* ---------- back-up ---------- */
function backupSheet(){
  openModal("Back-up",
    '<p class="muted">Bewaar je seizoenen als bestand. Doe dit na elke wedstrijd: de app bewaart alles op deze telefoon, en een browser kan opslag opruimen.</p>'+
    '<div class="card"><button class="opt" onclick="exportBackup()"><span style="flex:1">Bestand opslaan</span></button>'+
    '<button class="opt" onclick="copyBackup()"><span style="flex:1">Tekst kopiëren</span></button>'+
    '<button class="opt" onclick="importBackup()"><span style="flex:1;color:var(--danger)">Back-up terugzetten</span></button></div>'+
    '<div class="ver">'+(S.lastBackup ? "Laatste back-up: " + dateNL(S.lastBackup) : "Nog geen back-up gemaakt")+'</div>');
}
function backupBlobName(){ return "bankwacht-" + new Date().toISOString().slice(0,10) + ".json"; }
function markBackup(){ S.lastBackup = new Date().toISOString().slice(0,10); save(true); }
function exportBackup(){
  const data = JSON.stringify(S);
  try{
    const blob = new Blob([data], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = backupBlobName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    markBackup(); closeModal(); toast("Back-up opgeslagen");
  }catch(e){ copyBackup(); }
}
async function copyBackup(){
  const data = JSON.stringify(S);
  try{
    await navigator.clipboard.writeText(data);
    markBackup(); closeModal(); toast("Back-up gekopieerd — plak ze in een notitie of mail");
  }catch(e){
    openModal("Back-up kopiëren", '<p class="muted">Selecteer alles en kopieer.</p><div class="pad"><textarea class="ta" readonly>'+esc(data)+'</textarea></div>');
  }
}
function importBackup(){
  openModal("Back-up terugzetten",
    '<p class="muted">Alles wat nu in de app staat wordt vervangen.</p>'+
    '<div class="pad"><input type="file" id="bfile" accept=".json,application/json" style="margin-bottom:12px">'+
    '<textarea id="btext" class="ta" style="height:140px" placeholder="of plak hier"></textarea></div>'+
    '<div class="pad" style="padding-top:0"><button class="btn dngr" id="bgo">Terugzetten</button></div>',
    { onMount(mo){
        mo.querySelector("#bfile").onchange = e=>{
          const f = e.target.files[0]; if(!f) return;
          const r = new FileReader(); r.onload = ()=>{ mo.querySelector("#btext").value = r.result; }; r.readAsText(f);
        };
        mo.querySelector("#bgo").onclick = ()=>{
          try{
            const p = JSON.parse(mo.querySelector("#btext").value);
            if(!p || !Array.isArray(p.seasons)) throw new Error("ongeldig");
            S = p; migrate(); save(true); closeModal(); go("home"); toast("Back-up teruggezet");
          }catch(err){ toast("Dit bestand kon ik niet lezen"); }
        };
      }});
}

/* ---------- lus en scherm ---------- */
setInterval(()=>{
  if(VIEW === "match") paint();
  const m = match(); if(m && m.clock && m.clock.running) save();
}, 500);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) paint(); });
window.addEventListener("pageshow", ()=> paint());

let wakeLock = null;
async function keepAwake(){
  try{
    const m = match();
    if(VIEW === "match" && m && m.clock.running && "wakeLock" in navigator){
      if(!wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    }else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
setInterval(keepAwake, 4000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ wakeLock = null; keepAwake(); } });

/* offline draaien op een eigen adres */
if("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai$/.test(location.hostname)){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- start ---------- */
load();
if(S.seasons.length && !S.activeSeason) S.activeSeason = S.seasons[0].id;
const cur = match();
if(cur && cur.status === "live") VIEW = "match"; else if(season()) VIEW = "season";
render();
</script>
</body>
</html>
